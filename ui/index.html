<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migration Accelerator · AWS to GCP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='1' width='12' height='12' fill='none' stroke='%2320242a' stroke-width='2'/%3E%3Crect x='9' y='9' width='12' height='12' fill='%2320242a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --ink:#20242a; --ink-2:#4d5560; --ink-3:#77808b;
  --canvas:#f3f4f6; --surface:#fff; --sunken:#f8f9fa;
  --rule:#d9dde2; --rule-2:#eceef1;
  --action:#1f5aa6; --action-hover:#184b8c; --action-soft:#eaf1fa;
  --pass:#1e7b45; --pass-bg:#e8f3ec;
  --fail:#b42318; --fail-bg:#fbeae8;
  --review:#8f5400; --review-bg:#fbf1e0;
  --waived:#44597a; --waived-bg:#ebeff5;
  --neutral:#5b6470; --neutral-bg:#eef0f2;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:2px; --r2:3px;
  --top:48px; --navw:228px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--action);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:1px}
code,.mono{font-family:var(--mono);font-size:12px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:0}
h1{font-size:22px;line-height:28px}
h2{font-size:16px;line-height:22px}
h3{font-size:14px;line-height:20px}
p{margin:0}
.muted{color:var(--ink-3)}.sub{color:var(--ink-2)}.small{font-size:12px;line-height:16px}
.num{text-align:right;white-space:nowrap}
.nowrap{white-space:nowrap}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------------------------------------------------------------- shell */
.topbar{position:sticky;top:0;z-index:30;height:var(--top);background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:16px;padding:0 16px 0 0}
.brand{width:var(--navw);flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--rule)}
.brand svg{flex:none}
.brand b{font-size:14px;font-weight:600;line-height:16px}
.brand span{display:block;font-size:11px;color:var(--ink-3);line-height:14px}
.proj{display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.proj>button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:var(--r);padding:5px 8px;cursor:pointer;min-width:0}
.proj>button:hover{border-color:var(--rule);background:var(--sunken)}
.proj .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .pmeta{color:var(--ink-3);font-size:12px;white-space:nowrap}
.popover{position:absolute;top:calc(100% + 6px);left:0;width:380px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);box-shadow:0 8px 24px rgba(32,36,42,.12);padding:14px 16px;display:none;z-index:40}
.popover.on{display:block}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.mode{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:0 8px}
.mode i{width:7px;height:7px;border-radius:1px;background:var(--neutral)}
.mode.live i{background:var(--pass)}

.shell{display:grid;grid-template-columns:var(--navw) minmax(0,1fr);min-height:calc(100vh - var(--top))}
nav.side{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;padding:10px 0 20px}
nav.side .grp{padding:14px 16px 4px;font-size:12px;font-weight:600;color:var(--ink-3)}
nav.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 6px 14px;color:var(--ink);border-left:2px solid transparent;text-decoration:none;font-size:14px}
nav.side a:hover{background:var(--sunken)}
nav.side a[aria-current=page]{border-left-color:var(--action);background:var(--action-soft);color:var(--action);font-weight:500}
nav.side .cnt{font-size:12px;color:var(--ink-3);font-weight:400}
nav.side .cnt.bad{color:var(--fail);font-weight:600}
nav.side .cnt.warn{color:var(--review);font-weight:600}
nav.side .foot{margin:18px 16px 0;padding-top:12px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--ink-3);line-height:16px}

main{min-width:0;padding:16px 24px 64px}
.crumbs{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.pagehead .desc{color:var(--ink-2);margin-top:4px;max-width:78ch}
.pagehead .acts{display:flex;gap:8px;flex:none;padding-top:2px}
.flash{display:flex;gap:10px;align-items:flex-start;border:1px solid;border-radius:var(--r2);padding:9px 12px;margin-bottom:12px;font-size:13px}
.flash.ok{border-color:#b8d9c4;background:var(--pass-bg)}
.flash.err{border-color:#f0c2bd;background:var(--fail-bg)}
.flash.info{border-color:#c9d6e8;background:var(--action-soft)}
.flash.warn{border-color:#e8d3a9;background:var(--review-bg)}
.flash button{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-2);padding:0 2px;font-size:16px;line-height:1}

/* ---------------------------------------------------------------- controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--sunken);border-color:#c5cad1;text-decoration:none}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}
.btn.primary:hover{background:var(--action-hover)}
.btn.danger{color:var(--fail)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=search],input[type=text],input[type=date],select,textarea{height:32px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);padding:0 8px}
textarea{height:auto;padding:6px 8px;resize:vertical;width:100%}
input[type=search]{min-width:240px}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:3px}
label.fld input,label.fld select{width:100%}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.toolbar .grow{flex:1}
.toolbar label.inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}

/* segmented filter with counts */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--rule);background:none;padding:0 10px;height:30px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button b{font-weight:600;color:var(--ink);margin-left:4px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg button[aria-pressed=true] b{color:#fff}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:12px}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .c{color:var(--ink-3);font-weight:400;margin-left:4px}

/* status indicator */
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.st::before{content:"";width:8px;height:8px;border-radius:1px;flex:none;background:currentColor}
.st.pass{color:var(--pass)}.st.fail{color:var(--fail)}.st.review{color:var(--review)}.st.waived{color:var(--waived)}.st.neutral{color:var(--neutral)}.st.info{color:var(--action)}
.tag{display:inline-block;border:1px solid;border-radius:var(--r);padding:0 6px;font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
.tag.pass{color:var(--pass);border-color:#b8d9c4;background:var(--pass-bg)}
.tag.fail{color:var(--fail);border-color:#f0c2bd;background:var(--fail-bg)}
.tag.review{color:var(--review);border-color:#ecd3a8;background:var(--review-bg)}
.tag.waived{color:var(--waived);border-color:#cdd6e3;background:var(--waived-bg)}
.tag.neutral{color:var(--neutral);border-color:var(--rule);background:var(--neutral-bg)}

/* containers */
.box{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2)}
.box>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule-2)}
.box>.hd .note{font-size:12px;color:var(--ink-3)}
.box>.bd{padding:12px 14px}
.box+.box,.box+.sect,.sect+.box,.sect+.sect{margin-top:16px}
.sect>h2{margin-bottom:8px}
.cols>.box,.cols>.sect,.cols>div{margin-top:0}
.cols{display:grid;gap:16px}
.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* key-value */
dl.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 16px;margin:0;font-size:13px}
dl.kv dt{color:var(--ink-3)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
dl.kv dd .st{white-space:normal;align-items:baseline}
dl.kv dd .st::before{transform:translateY(-1px)}
.trunc{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.toast{position:fixed;top:calc(var(--top) + 12px);right:16px;z-index:50;max-width:440px;box-shadow:0 8px 24px rgba(32,36,42,.14)}

/* summary metrics row */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2)}
.metrics>div{padding:10px 14px;border-right:1px solid var(--rule-2)}
.metrics>div:last-child{border-right:0}
.metrics .v{font-size:20px;line-height:26px;font-weight:600}
.metrics .l{font-size:12px;color:var(--ink-2)}
.metrics .v.fail{color:var(--fail)}.metrics .v.pass{color:var(--pass)}.metrics .v.review{color:var(--review)}

/* tables */
.tw{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);overflow:auto}
.tw.flush{border:0;border-radius:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{position:sticky;top:0;background:var(--sunken);color:var(--ink-2);font-weight:600;font-size:12px;border-bottom:1px solid var(--rule);white-space:nowrap;z-index:1}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .arr{display:inline-block;width:10px;color:var(--ink-3);margin-left:2px}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#f6f8fb}
tbody tr.sel td{background:var(--action-soft)}
tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--action)}
td.empty{color:var(--ink-3);padding:20px 12px;text-align:center}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--ink-2);background:var(--surface)}
.pager .pgb{display:flex;gap:4px}

/* split view */
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr) 460px}
.split.solo{grid-template-columns:minmax(0,1fr)}
.split.solo>.panel{display:none}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);position:sticky;top:calc(var(--top) + 16px);max-height:calc(100vh - var(--top) - 32px);overflow:auto}
.panel .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--rule-2);position:sticky;top:0;background:var(--surface);z-index:2}
.panel .ph .x{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1;padding:0 2px}
.panel .pb{padding:12px 14px}
.panel .pb h3{margin:14px 0 6px}
.panel .pb h3:first-child{margin-top:0}
.panel .empty{padding:28px 16px;color:var(--ink-3);text-align:center;font-size:13px}
.panel ul{margin:0;padding-left:18px;font-size:13px}
.panel li{margin:2px 0}
.form{border-top:1px solid var(--rule-2);margin-top:14px;padding-top:12px}
.form .row{display:flex;gap:8px}
.ro-note{font-size:12px;color:var(--ink-3);border:1px dashed var(--rule);border-radius:var(--r);padding:8px 10px}

/* lists */
.attn{list-style:none;margin:0;padding:0}
.attn li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--rule-2)}
.attn li:last-child{border-bottom:0}
.attn .sq{width:8px;height:8px;border-radius:1px;margin-top:6px}
.attn .sq.fail{background:var(--fail)}.attn .sq.review{background:var(--review)}.attn .sq.info{background:var(--action)}
.attn b{font-weight:600}
.attn .why{font-size:12px;color:var(--ink-2)}
.attn a{font-size:13px;white-space:nowrap}

.stages{list-style:none;margin:0;padding:0}
.stages li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule-2);align-items:baseline}
.stages li:last-child{border-bottom:0}
.stages .n{font-size:12px;color:var(--ink-3);font-weight:600}
.stages .t{font-weight:500}
.stages .d{font-size:12px;color:var(--ink-2)}

/* bars */
.bar{height:6px;background:var(--rule-2);border-radius:1px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink-2)}
.bar.fail i{background:var(--fail)}.bar.review i{background:#c98a1a}.bar.pass i{background:var(--pass)}.bar.action i{background:var(--action)}
.barcell{display:grid;grid-template-columns:minmax(60px,1fr) 36px;gap:8px;align-items:center}

/* journey stepper */
.journey{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);margin-bottom:16px}
.journey .hd{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--rule-2)}
.journey ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(11,minmax(0,1fr))}
.journey li{padding:9px 10px 10px;border-right:1px solid var(--rule-2);position:relative;min-width:0}
.journey li:last-child{border-right:0}
.journey li::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rule)}
.journey li.pass::before{background:var(--pass)}.journey li.fail::before{background:var(--fail)}.journey li.review::before{background:#c98a1a}
.journey li.recovered::before{background:linear-gradient(90deg,var(--fail) 0 30%,var(--pass) 30%)}
.journey .k{font-size:11px;color:var(--ink-3)}
.journey .t{font-weight:600;font-size:13px}
.journey .e{font-size:11px;line-height:14px;color:var(--ink-2);margin-top:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;display:inline-block}

/* code */
.code{display:grid;grid-template-columns:auto 1fr;font-family:var(--mono);font-size:12px;line-height:18px;background:var(--surface);overflow:auto;max-height:560px}
.code .ln{color:#a3a9b1;text-align:right;padding:8px 8px 8px 10px;user-select:none;border-right:1px solid var(--rule-2);background:var(--sunken)}
.code .src{padding:8px 12px;white-space:pre;min-width:0}
.code .src .hl{background:#fdf3d8;display:inline-block;min-width:100%}
.codepair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--rule-2)}
.codepair>div{min-width:0}
.codepair>div+div{border-left:1px solid var(--rule)}
.codepair .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--rule-2);background:var(--sunken);min-height:36px}
.filetabs{display:flex;gap:0;overflow:auto;border-bottom:1px solid var(--rule-2);background:var(--sunken)}
.filetabs button{border:0;border-right:1px solid var(--rule-2);background:none;padding:6px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.filetabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 2px 0 var(--action)}
pre.json{margin:0;background:var(--sunken);border:1px solid var(--rule-2);border-radius:var(--r);padding:8px 10px;font:12px/18px var(--mono);overflow:auto;max-height:260px;white-space:pre-wrap;overflow-wrap:anywhere}

/* conversion list */
.flist{list-style:none;margin:0;padding:0}
.flist li{padding:9px 12px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.flist li:hover{background:#f6f8fb}
.flist li[aria-selected=true]{background:var(--action-soft);box-shadow:inset 2px 0 0 var(--action)}
.flist .f{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.flist .m{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);margin-top:2px}

/* batches */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.lane{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;cursor:pointer;padding:12px 14px 12px;border-right:1px solid var(--rule-2);position:relative;min-width:0}
.lane:last-child{border-right:0}
.lane::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rule)}
.lane.pass::before{background:var(--pass)}.lane.fail::before{background:var(--fail)}.lane.review::before{background:#c98a1a}
.lane:hover{background:var(--sunken)}.lane:focus-visible{outline:2px solid var(--action);outline-offset:-2px}
.lane.sel{background:var(--action-soft)}
.lane .lt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}.lane .lt b{font-size:14px}
.lane .ls{font-size:12px;color:var(--ink-2);margin-bottom:8px}
.lane .lv{font-size:22px;line-height:28px;font-weight:600}.lane .lv span{font-size:12px;font-weight:400;color:var(--ink-2)}
.lane .ld{font-size:12.5px;color:var(--ink);margin-top:4px}.lane .lr{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.lane.none{cursor:default}.lane.none:hover{background:none}
.rec{border:1px solid var(--rule);border-radius:var(--r2);background:var(--sunken);padding:10px 12px;margin-bottom:12px}
.rec h3{margin:0 0 6px;font-size:13px}
@media (max-width:900px){.lanes{grid-template-columns:1fr}.lane{border-right:0;border-bottom:1px solid var(--rule-2)}}
.batches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.batch{border:1px solid var(--rule);border-top:3px solid var(--pass);background:var(--surface);border-radius:var(--r);padding:6px 8px;text-align:left;cursor:pointer;font-size:12px;line-height:16px}
.batch:hover{border-color:#b9c0c8}
.batch.FAILED{border-top-color:var(--fail)}.batch.retried{border-top-color:#c98a1a}
.batch.sel{outline:2px solid var(--action);outline-offset:-1px}
.batch b{display:block;font-size:13px}
.batch .q{color:var(--review)}

/* graph */
.graphwrap{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);overflow:hidden;height:640px;cursor:grab}
.graphwrap.drag{cursor:grabbing}
#graph{width:100%;height:100%;display:block}
.gn rect.body{fill:#fff;stroke:#9aa3ad;stroke-width:1}
.gn .t1{font:500 13px var(--sans);fill:var(--ink)}
.gn .t2{font:11.5px var(--sans);fill:var(--ink-3)}
.gn.consumer rect.body{stroke:var(--ink);stroke-width:1.5}

.ge.rejected{stroke:#c0392b;stroke-dasharray:2 3;opacity:.45}
.lrow{border-top:1px solid var(--rule-2);padding:8px 0}
pre.diff .add{color:#17663a;background:#e8f4ec;display:inline-block;width:100%}
pre.diff .del{color:#a12a1f;background:#fbeae8;display:inline-block;width:100%}
.lrow:first-of-type{border-top:0}

.ge.dim{opacity:.12}

.gzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}

.gcolhd{font:600 11px var(--sans);fill:var(--ink-3)}

/* email preview */
.mail{border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface)}
.mail .mh{padding:10px 14px;border-bottom:1px solid var(--rule-2);font-size:13px}
.mail .mh div{display:grid;grid-template-columns:64px 1fr;gap:8px}
.mail .mh dt{color:var(--ink-3)}

/* drop zone */
.drop{display:flex;align-items:center;gap:14px;border:1px dashed #b7bec7;border-radius:var(--r2);padding:14px 16px;background:var(--surface)}
.drop.over{border-color:var(--action);background:var(--action-soft)}
.drop .dt{flex:1}

/* reconciliation summary */
.recon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface);margin-bottom:12px}
.recon>div{padding:10px 14px;border-right:1px solid var(--rule-2)}
.recon>div:last-child{border-right:0}
.recon h3{font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.recon table{font-size:13px}
.recon td{padding:2px 0;border:0}
.recon td:last-child{text-align:right;font-weight:500}
.delta-bad{color:var(--fail);font-weight:600}

.compare{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule-2);border-radius:var(--r);margin:4px 0 8px}
.compare>div{padding:8px 10px}
.compare>div+div{border-left:1px solid var(--rule-2)}
.compare .k{font-size:12px;color:var(--ink-3)}
.compare .v{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}

.waves{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface)}
.waves>div{padding:10px 12px;border-right:1px solid var(--rule-2)}
.waves>div:last-child{border-right:0}
.waves .wn{font-size:12px;color:var(--ink-3);font-weight:600}
.waves .wt{font-weight:600;margin:2px 0 4px}
.waves .wa{font-size:12px;color:var(--ink-2)}
.waves .wr{font-size:12px;color:var(--ink-3);margin-top:6px}

.dims td .bar{margin-top:6px}

details.log summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.log summary::-webkit-details-marker{display:none}
details.log summary::after{content:"Show";font-weight:400;color:var(--action);font-size:13px}
details.log[open] summary::after{content:"Hide"}
.logl{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-2)}
.logl li{display:grid;grid-template-columns:28px 210px minmax(0,1fr);gap:10px;padding:7px 14px;border-bottom:1px solid var(--rule-2);font-size:13px}
.logl li:last-child{border-bottom:0}
.logl .n{color:var(--ink-3);font-size:12px}

.catgrid{columns:4 180px;column-gap:24px;font-size:13px;padding:12px 14px}
.catgrid div{break-inside:avoid;padding:2px 0}
.catgrid mark{background:#fdf3d8;color:inherit}

dialog{border:1px solid var(--rule);border-radius:var(--r2);padding:0;width:min(560px,92vw);box-shadow:0 16px 40px rgba(32,36,42,.18)}

dialog .db{padding:14px 16px}
dialog .df{padding:10px 16px;border-top:1px solid var(--rule-2);display:flex;justify-content:flex-end;gap:8px}

@media (max-width:1280px){.split,.split.wide{grid-template-columns:minmax(0,1fr) 340px}.journey ol{grid-template-columns:repeat(6,minmax(0,1fr))}.journey li:nth-child(6){border-right:0}.journey li:nth-child(n+7){border-top:1px solid var(--rule-2)}}

@media (max-width:820px){:root{--navw:0px}.brand{width:auto;border-right:0}.shell{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;flex-wrap:wrap;padding:6px}nav.side .grp,nav.side .foot{display:none}nav.side a{border-left:0;padding:6px 10px}main{padding:12px}.proj .pmeta,.mode,#btnReset{display:none!important}.brand span{display:none}.proj{min-width:0;flex:1}.top-right{margin-left:0}.btn.primary{padding:0 8px}}
@media (prefers-reduced-motion:no-preference){
  .btn,.seg button,.tabs button,nav.side a,.flist li,tbody tr.click td,.filetabs button,.batch,.proj>button{transition:background-color .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease}
  .gn,.ge{transition:opacity .16s ease,stroke .16s ease}
  #gView.anim{transition:transform .22s ease}
  .bar i{transition:width .3s ease}
  main.enter{animation:pageIn .14s ease-out}
  .panel .pb,.panel .empty{animation:panelIn .16s ease-out}
  .toast{animation:toastIn .2s ease-out}
  .popover.on{animation:panelIn .12s ease-out}
  details.log[open] .logl{animation:panelIn .16s ease-out}
}
@keyframes pageIn{from{opacity:.4}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.sim{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--review);background:#fbf3e4;border:1px solid #e3c88f;border-radius:var(--r);padding:3px 8px;white-space:nowrap}

.meth.ai{color:var(--action);border-color:#b9cde8}
.tag.seed{color:var(--review);border-color:#e3c88f;background:#fbf3e4}
.ev{display:inline-block;font-size:11px;font-weight:600;color:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r);padding:1px 6px;white-space:nowrap}

.st5 .c-validated a{color:var(--pass)}.st5 .c-manual a{color:var(--review)}.st5 .c-discrepancy a{color:var(--fail)}.st5 .c-awaiting a{color:var(--action)}.st5 .c-approved a{color:var(--waived)}

.plist .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plist .m{color:var(--ink-3);font-size:12px;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.fgrid .wide{grid-column:1/-1}
@media (max-width:820px){.fgrid{grid-template-columns:1fr}}
label.fld small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px}label.fld .fe{display:block;color:var(--fail);font-size:12px;margin-top:3px}
label.fld.bad input,label.fld.bad select{border-color:var(--fail)}

<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="12" height="12" fill="none" stroke="#20242a" stroke-width="2"/><rect x="9" y="9" width="12" height="12" fill="#20242a"/></svg>
    <div><b>Migration Accelerator</b><span>AWS to Google Cloud</span></div>
  </div>
  <div class="proj">
    <button id="projBtn" aria-haspopup="true" aria-expanded="false"><span class="pname" id="pname">Loading project</span><span class="pmeta" id="pmeta"></span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="#77808b" stroke-width="1.5"/></svg></button>
    <div class="popover" id="projPop" role="dialog" aria-label="Project details"></div>
  </div>
  <div class="top-right">
    <div class="sim" id="simChip" hidden title="AWS and Google Cloud are stood in for by local sample files. No real cloud account is read or changed."><i></i><span>Simulated execution</span></div>
    <div class="mode" id="mode"><i></i><span></span></div>
    <button class="btn" id="btnReset" hidden>Reset demo run</button>
    <a class="btn primary" id="btnReport" href="#" target="_blank" rel="noopener">Readiness report</a>
  </div>
</header>
<div class="shell">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg"><div class="dh"><h2 id="dlgT"></h2><button class="btn sm" id="dlgX">Close</button></div><div class="db" id="dlgB"></div></dialog>
<script>
"use strict";
/* ============================================================== state */
let S=null, LIVE=false, FLASH=null;
let PID=(()=>{try{return new URLSearchParams(location.search).get("project")||localStorage.getItem("mx.project")||""}catch(e){return ""}})();
const pq=(first=true)=>PID?`${first?"?":"&"}project=${encodeURIComponent(PID)}`:"";
const setPid=id=>{PID=id||"";try{PID?localStorage.setItem("mx.project",PID):localStorage.removeItem("mx.project")}catch(e){}};
const UI={};                         // per-screen UI state survives re-render
const TS={};                         // table sort/page state
const $=s=>document.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>v==null?"":String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{if(typeof n==="number")return n.toLocaleString("en-US",{maximumFractionDigits:2});if(typeof n==="string"&&/^-?\d+(\.\d+)?$/.test(n)){const d=(n.split(".")[1]||"").length;return Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}return esc(n)};
const human=s=>{if(s==null)return"";s=String(s).replace(/_/g," ").toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};
const time=s=>s?String(s).slice(11,19):"";
const day=s=>s?String(s).slice(0,10):"";

const TONE={pass:["PASS","APPROVED","LOADED","COMPLETED","CORROBORATED","CONFIRMED","READY_FOR_SIGNOFF","ACCEPTED","Low","verified"],
  fail:["FAIL","FAILED","BLOCKED","REJECTED","CONFLICT","Critical","BLOCKED_OWNER_UNKNOWN","COMPLETED_WITH_FAILURES","CRITICAL"],
  review:["REVIEW","PENDING","PENDING_REVIEW","INFERRED","NEEDS_REVIEW","High","OPEN","CONDITIONAL","Medium","WARN","DUPLICATE","HIGH"],
  waived:["WAIVED","PROCEED"],info:["DRAFT","CAPTURED","RUNNING"]};
TONE.pass.push("AVAILABLE","CLEAR","SIGNED_OFF","MITIGATED","ACCEPTED_LOW");TONE.fail.push("DISCREPANCY","MISSING","HOLD");TONE.review.push("NEEDS_CONFIRMATION","NEEDS_DECISION","CANNOT_CHECK","BUSINESS_ONLY","TECHNICAL_ONLY","IN_PROGRESS","PENDING");
const tone=v=>{for(const[k,a]of Object.entries(TONE))if(a.includes(v))return k;return"neutral"};
const LABEL={BLOCKED_OWNER_UNKNOWN:"Owner unknown",READY_FOR_SIGNOFF:"Ready for sign-off",COMPLETED_WITH_FAILURES:"Completed with failures",INVENTORY_ONLY:"Inventory only",IAC_ONLY:"IaC only",NOT_RUN:"Not run",
  AVAILABLE:"Available",DISCREPANCY:"Differences found",MISSING:"Not in target",CANNOT_CHECK:"Could not check",CLEAR:"Clear",NEEDS_CONFIRMATION:"Needs confirmation",NEEDS_DECISION:"Needs decision",PROCEED:"Accepted",HOLD:"On hold",
  SIGNED_OFF:"Signed off",BUSINESS_ONLY:"Business signed, awaiting technical",TECHNICAL_ONLY:"Technical signed, awaiting business",PENDING:"Awaiting sign-off",ACCEPTED_LOW:"Accepted (low)",IN_PROGRESS:"In progress",MITIGATED:"Mitigated",
  NOT_SENT:"Not sent",SENT:"Sent, no reply yet",BOUNCED:"Bounced",REPLIED:"Replied",CHANGED_SINCE_APPROVAL:"Changed since approval",
  NOT_STARTED:"Still on AWS",MIGRATED:"On Google Cloud",OWNER_CONFIRMED:"Owner confirmed",OWNER_REVERSED:"Owner confirmed, other direction",OWNER_REJECTED:"Owner says not a real link",
  UNCONFIRMED:"Not confirmed",BRIDGE_AGREED:"Bridge agreed",ACKNOWLEDGED:"Acknowledged",QUESTION:"Question",OBJECTION:"Objection"};
TONE.pass.push("REPLIED","MIGRATED","OWNER_CONFIRMED","OWNER_REVERSED","BRIDGE_AGREED","ACKNOWLEDGED");TONE.fail.push("BOUNCED","OBJECTION","OWNER_REJECTED");
TONE.review.push("CHANGED_SINCE_APPROVAL","UNCONFIRMED","QUESTION");TONE.info.push("SENT");
const APP_ST={NOT_STARTED:"Still on AWS",IN_PROGRESS:"Cutover in progress",MIGRATED:"On Google Cloud"};
const appSt=a=>((S.app_status||{})[a]||{}).status||"NOT_STARTED";
const st=(v,label)=>`<span class="st ${tone(v)}"${stateTip(v)}>${esc(label??LABEL[v]??human(v))}</span>`;
const tag=(v,label)=>`<span class="tag ${tone(v)}"${stateTip(v)}>${esc(label??LABEL[v]??human(v))}</span>`;
const bar=(pct,cls="")=>`<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;
const riskCls=s=>s>=75?"fail":s>=50?"review":"pass";
const clsCls=c=>({Critical:"fail",High:"review",Medium:"review",Low:"pass"}[c]||"action");

/* ---- honesty helpers: what is simulated, how outputs were produced, how strong the evidence is */
const isSim=()=>S&&S.project&&(((S.project.config||{}).execution==="simulated")||/synthetic|prototype/i.test(`${S.project.aws_account||""} ${S.project.customer||""}`));
const isSample=()=>!S.stages||S.stages.sample;
const aiOn=()=>!!(S&&S.agent_runs&&S.agent_runs.some(a=>a.model_version&&!/llm\s*=\s*none/i.test(a.model_version)));
const METH_SCREENS=["availability","discovery","dependencies","mapping","conversion","plan","validation","readiness","stakeholders"];
const methBadge=id=>METH_SCREENS.includes(id)?(aiOn()
  ?`<span class="meth ai" title="Explanations come from a language model. Counts, hashes, scores and comparisons are always computed in code.">AI-assisted</span>`
  :`<span class="meth" title="Every result on this screen comes from deterministic rules and code. No language model is connected, so nothing here is a model's opinion.">Rules only</span>`):"";
/* scenario of a validation run, read from the recorded run story */
function scenarioOf(v){
  const story=(S.migration&&S.migration.story)||[];
  const at=story.find(x=>x.validation_run===v.id); if(!at) return null;
  const seed=story.find(x=>/^SEEDED DEFECTS/.test(x.step));
  if(/^VALIDATE \(post-load\)/.test(at.step)&&seed){
    const raw=Array.isArray(seed.partitions)?seed.partitions:[];
    return {tag:"Seeded test defect",parts:raw.map(x=>String(x).split(" ")[0]),
      note:`Faults were planted in the Google Cloud copy on purpose: ${raw.join("; ")}. They are there so the checks have something to find. The failures in this run are expected test results, not real data loss.`};}
  if(/^SOURCE CHANGED/.test(at.step))
    return {tag:"Simulated source change",parts:[],note:`The AWS sample source was changed after the baseline on purpose${at.changes?` (${at.changes} changes)`:""} so the lag check has something to find. The failure is an expected test result.`};
  if(/^CUSTOMER exact/.test(at.step))
    return {tag:"Sample mismatch data",parts:[],note:"The customer sample files differ on purpose (blueprint section 12.4) so exact reconciliation has something to find. The failure is an expected test result."};
  return null;
}
const seedTag=t=>`<span class="tag seed">${esc(t)}</span>`;
/* strength of the evidence behind one check */
function evLevel(r,v){
  const strat=((v.summary||{}).strategy||{}).strategy||"";
  if(/exact/i.test(strat)) return ["Row-level","row","Every row was compared by key."];
  if(r.dimension==="row_diff") return ["Key-level","key","Rows were compared by key inside a partition that failed."];
  if(r.dimension==="hash") return ["Content hash","key","An order-independent hash of every row in the partition. It proves the content matches, but not which row differs."];
  if(r.dimension==="schema"||r.dimension==="coverage") return ["Metadata","","Compares structure only: columns, types, and which partitions exist."];
  return ["Aggregate","","Totals match, which is evidence but not proof that every record is identical."];
}
const evTag=(r,v)=>{const[l,c,t]=evLevel(r,v);return `<span class="ev ${c}" title="${esc(t)}">${esc(l)}</span>`};
/* the five states every item is in */
const STATE5={validated:["Validated automatically","Checked by the tool and passing."],manual:["Needs a manual check","The tool could not decide. A person has to verify it."],
  discrepancy:["Has a discrepancy","A difference or problem was found."],awaiting:["Awaiting approval","Waiting for someone to approve, confirm or send it."],approved:["Approved to continue","A person approved it, or recorded a waiver."]};
const STATE_OF={AVAILABLE:"validated",CLEAR:"validated",NEEDS_CONFIRMATION:"manual",NEEDS_DECISION:"awaiting",DISCREPANCY:"discrepancy",MISSING:"discrepancy",CANNOT_CHECK:"manual",PROCEED:"approved",HOLD:"awaiting",PASS:"validated",CORROBORATED:"validated",CONFIRMED:"validated",ACCEPTED:"validated",
  REVIEW:"manual",NOT_RUN:"manual",NEEDS_REVIEW:"manual",INFERRED:"manual",OPEN:"manual",BLOCKED_OWNER_UNKNOWN:"manual",WARN:"manual",DUPLICATE:"manual",CONDITIONAL:"manual",PENDING_REVIEW:"manual",INVENTORY_ONLY:"manual",IAC_ONLY:"manual",
  FAIL:"discrepancy",FAILED:"discrepancy",CONFLICT:"discrepancy",COMPLETED_WITH_FAILURES:"discrepancy",REJECTED:"discrepancy",
  PENDING:"awaiting",DRAFT:"awaiting",BLOCKED:"awaiting",
  APPROVED:"approved",WAIVED:"approved",READY_FOR_SIGNOFF:"approved"};
const state5=v=>STATE_OF[v]||null;
const stateTip=v=>{const k=state5(v);return k?` title="${esc(STATE5[k][0])}. ${esc(STATE5[k][1])}"`:""};

/* ============================================================== navigation */
const NAV=[
  [null,[["overview","Overview"]]],
  ["Assess",[["uploads","Uploads"],["discovery","Discovery"],["dependencies","Dependencies"],["availability","Data availability"],["mapping","Service mapping"]]],
  ["Build",[["conversion","Code conversion"]]],
  ["Move data",[["plan","Movement plan"],["loads","Load runs"],["validation","Validation"]]],
  ["Go live",[["readiness","Readiness"],["stakeholders","Stakeholders"],["audit","Reports and audit"]]]];
const TITLES=Object.fromEntries(NAV.flatMap(([g,items])=>items.map(([id,n])=>[id,[g,n]])));
TITLES.new=[null,"New project"];
const route=()=>{const h=(location.hash||"#overview").slice(1);return TITLES[h]?h:"overview"};

function navCounts(){
  const pendMap=S.mappings.filter(m=>m.approval_status==="PENDING").length;
  const lv=latestValidations(), failing=lv.filter(v=>v.status==="FAIL").length;
  const blocked=Object.values(S.risk).filter(r=>r.readiness==="BLOCKED").length;
  const unknown=S.notifications.filter(n=>n.status==="BLOCKED_OWNER_UNKNOWN").length;
  return {uploads:[S.uploads.length],discovery:[S.discovery.stats.conflicts?`${S.discovery.stats.conflicts} conflicts`:S.discovery.resources.length,S.discovery.stats.conflicts?"warn":""],
    dependencies:[S.graph.edges.length],availability:(()=>{const a=S.availability||{summary:{total:0,unresolved:0}};return[a.summary.unresolved?`${a.summary.unresolved} to resolve`:a.summary.total,a.summary.unresolved?"warn":""]})(),mapping:[pendMap?`${pendMap} pending`:S.mappings.length,pendMap?"warn":""],
    conversion:[S.conversions.length],plan:[S.plan.movement.length],loads:[S.migration.runs.length],

/* table: cols = [{k,l,r(row),s(sortValue)|false,num,w}] */
function table(id,rows,cols,o={}){
  const t=TS[id]=TS[id]||{k:o.sort||null,d:o.dir||1,p:0};
  let rs=rows.slice();
  if(t.k){const c=cols.find(c=>c.k===t.k);if(c){const sv=c.s||(r=>r[c.k]);rs.sort((a,b)=>{const x=sv(a),y=sv(b);return(x==null)-(y==null)||(x>y?1:x<y?-1:0)*t.d})}}
  const size=o.page||25, pages=Math.max(1,Math.ceil(rs.length/size)); if(t.p>=pages)t.p=pages-1;
  const view=rs.slice(t.p*size,(t.p+1)*size);
  const key=o.key||(r=>r.id);
  const th=cols.map(c=>{const sortable=c.s!==false;const on=t.k===c.k;
    return `<th scope="col" class="${sortable?"sortable":""} ${c.num?"num":""}" ${c.w?`style="width:${c.w}"`:""} data-k="${esc(c.k)}" ${sortable?`aria-sort="${on?(t.d>0?"ascending":"descending"):"none"}"`:""}>${esc(c.l)}${sortable?`<span class="arr">${on?(t.d>0?"↑":"↓"):""}</span>`:""}</th>`}).join("");
  const tb=view.map(r=>`<tr ${o.onSelect?`class="click ${o.selected!=null&&key(r)===o.selected?"sel":""}" tabindex="0" data-key="${esc(key(r))}"`:""}>${cols.map(c=>`<td class="${c.num?"num":""}">${c.r?c.r(r):esc(r[c.k])}</td>`).join("")}</tr>`).join("");
  const html=`<div class="tw ${o.flush?"flush":""}" id="${id}"><table><thead><tr>${th}</tr></thead><tbody>${tb||`<tr><td colspan="${cols.length}" class="empty">${esc(o.empty||"No items match these filters.")}</td></tr>`}</tbody></table>
   ${rs.length>size?`<div class="pager"><span>${t.p*size+1}–${Math.min(rs.length,(t.p+1)*size)} of ${fmt(rs.length)}</span><div class="pgb"><button class="btn sm" data-pg="-1" ${t.p===0?"disabled":""}>Previous</button><button class="btn sm" data-pg="1" ${t.p>=pages-1?"disabled":""}>Next</button></div></div>`:""}</div>`;
  return {html,bind:(rerender)=>{const el=document.getElementById(id);if(!el)return;
    $$("th.sortable",el).forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(t.k===k)t.d=-t.d;else{t.k=k;t.d=1}t.p=0;rerender()});
    $$("[data-pg]",el).forEach(b=>b.onclick=()=>{t.p+= +b.dataset.pg;rerender()});
    if(o.onSelect)$$("tr.click",el).forEach(tr=>{const go=()=>{const r=rows.find(x=>String(key(x))===tr.dataset.key);o.onSelect(r)};tr.onclick=go;tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}})}};
}
function mountTable(sel,id,rows,cols,o={}){const go=()=>{const t=table(id,rows,cols,o);$(sel).innerHTML=t.html;t.bind(go)};go();}

  const fwd=e.flow_default==="FORWARD", opt=(v,txt)=>`<label class="inline" style="display:flex;gap:8px;margin-bottom:6px"><input type="radio" name="outcome" value="${v}" ${e.owner_status===v?"checked":""}> ${txt}</label>`;
  show("Owner's answer about this link",`<form id="edForm" novalidate><div id="edErr"></div>
    <p class="small muted" style="margin-bottom:8px">${esc(human(e.type))} link between <b style="font-weight:500">${esc(a)}</b> and <b style="font-weight:500">${esc(b)}</b>, ${e.status==="CONFIRMED"?"from a confirmed source":"inferred"}. Record what the owner said.</p>
    ${opt(fwd?"OWNER_CONFIRMED":"OWNER_REVERSED",`Data flows from ${esc(a)} to ${esc(b)}`)}
    ${opt(fwd?"OWNER_REVERSED":"OWNER_CONFIRMED",`Data flows from ${esc(b)} to ${esc(a)}`)}
    ${opt("OWNER_REJECTED","Not a real link: neither reads the other")}
    <label class="fld" style="margin-top:8px"><span>Owner's name</span><input type="text" name="by"></label>
    <label class="fld"><span>What they said</span><textarea name="note" rows="2" style="width:100%;height:auto;padding:6px 8px"></textarea></label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">${e.owner_status?`<button class="btn" type="button" id="edClear" style="margin-right:auto">Clear the answer</button>`:""}<button class="btn" type="button" onclick="$('#dlg').close()">Cancel</button><button class="btn primary" type="submit" id="edGo">Save</button></div></form>`);
  const send=async(body,btn)=>{btn.disabled=true;try{await api(`/api/v1/projects/${encodeURIComponent(S.project.id)}/dependencies/confirm`,{source:e.source,target:e.target,...body});$("#dlg").close();await refresh({k:"ok",html:"Owner's answer recorded. Gates re-checked."})}
    catch(er){btn.disabled=false;$("#edErr").innerHTML=`<div class="flash err"><div>${esc(er.message)}</div></div>`}};
  $("#edForm").onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);if(!f.get("outcome")){$("#edErr").innerHTML=`<div class="flash err"><div>Choose one of the three answers.</div></div>`;return}
    send({outcome:f.get("outcome"),by:String(f.get("by")),note:String(f.get("note"))},$("#edGo"))};
  const c=$("#edClear");if(c)c.onclick=()=>send({outcome:"CLEAR",by:"console.user",note:""},c);
}

/* ------------------------------------------------- dependencies: applications (Round 6) */
function bDepApps(){
  const apps=[...new Set(S.graph.nodes.map(n=>n.application).filter(Boolean))].sort();
  const down=S.downstream_apps||{}, upOf=a=>apps.filter(x=>(down[x]||[]).includes(a));
  const rows=apps.map(a=>({application:a,status:appSt(a),down:down[a]||[],up:upOf(a),inProject:!!S.risk[a],
    unsure:S.graph.edges.filter(e=>e.flow==="UNCONFIRMED"&&[e.source,e.target].some(x=>(S.graph.nodes.find(n=>n.id===x)||{}).application===a)).length}));
  const draw=()=>mountTable("#daTbl","tDa",rows,[
    {k:"application",l:"Application",r:x=>`<b style="font-weight:500">${esc(x.application)}</b>${x.inProject?"":'<div class="small muted">Outside this assessment</div>'}`},
    {k:"status",l:"Where it runs",r:x=>st(x.status,APP_ST[x.status])},
    {k:"down",l:"Reads its data",s:x=>x.down.length,r:x=>x.down.length?esc(x.down.join(", ")):'<span class="muted small">None found</span>'},
    {k:"unsure",l:"Links to confirm",num:true,r:x=>x.unsure?`<span style="color:var(--review);font-weight:600">${x.unsure}</span>`:"0"}],
    {onSelect:r=>{UI.daSel=r.application;draw();daPanel(r)},selected:UI.daSel,key:r=>r.application,sort:"application"});
  draw();const sel=rows.find(r=>r.application===UI.daSel);sel?daPanel(sel):$("#daPanel").innerHTML=panelEmpty("Select an application to record where it runs and, for applications that read its data, whether a bridge was agreed.");
}
function daPanel(x){
  const rec=(S.app_status||{})[x.application], rk=S.risk[x.application], brid=(S.bridges||[]).filter(b=>b.source===x.application);
  const gate=rk?rk.gates.find(g=>g.gate==="DOWNSTREAM_READY"):null, pid=encodeURIComponent(S.project.id), app=encodeURIComponent(x.application);
  const next=x.status==="NOT_STARTED"?["IN_PROGRESS","Record cutover started"]:x.status==="IN_PROGRESS"?["MIGRATED","Record cutover complete"]:null;
  const canStart=!rk||rk.readiness==="SIGNED_OFF"||x.status!=="NOT_STARTED";
  $("#daPanel").innerHTML=panel(esc(x.application),st(x.status,APP_ST[x.status]),
    kv([["Readiness",rk?st(rk.readiness):'<span class="small muted">Not assessed here: record what its team tells you</span>'],["Last change",rec?`${esc(rec.updated_by)}, ${esc(String(rec.updated_at).replace("T"," ").slice(0,16))}`:""],["Note",esc(rec?rec.note:"")],
      ["Downstream gate",gate?`${st(gate.status)}<div class="small">${esc(gate.detail)}</div>`:""],["Reads from it",esc(x.down.join(", "))],["It reads from",esc(x.up.join(", "))]])+
    (LIVE?`<div class="form"><h3 style="margin:0 0 6px">Where it runs</h3>
      ${rk&&!canStart?`<p class="small" style="color:var(--review);margin-bottom:6px">Cutover can be recorded as started only after business and technical sign-off. It is ${esc((LABEL[rk.readiness]||human(rk.readiness)).toLowerCase())} now.</p>`:""}
      <p class="small muted" style="margin-bottom:6px">Recording a start or a completion drafts "Migration started" or "Migration completed" e-mails to this application's owner and to the owners of every application that reads its data. They appear on Stakeholders for approval.</p>
      <label class="fld"><span>New status</span><select id="daSt">${Object.entries(APP_ST).filter(([k])=>k!==x.status).map(([k,v])=>`<option value="${k}" ${next&&next[0]===k?"selected":""}>${esc(v)}${k==="NOT_STARTED"&&x.status!=="NOT_STARTED"?" (rolled back)":""}</option>`).join("")}</select></label>
      <label class="fld"><span>Recorded by</span><input type="text" id="daBy" autocomplete="name"></label>
      <label class="fld"><span>What happened, or who told you (at least 10 characters)</span><textarea id="daNote" rows="2" style="width:100%;height:auto;padding:6px 8px"></textarea></label>
      <p><button class="btn primary" id="daGo">Save status</button></p><div class="small" style="color:var(--fail)" id="daErr"></div></div>`:roNote("Recording migration status"))+
    (x.down.length?`<h3>Applications that read its data</h3><p class="small muted" style="margin-bottom:6px">Each must be on Google Cloud, or its owner must have agreed a bridge (dual run, copy back), before ${esc(x.application)} is cut over.</p>
      ${x.down.map(d=>{const b=brid.find(y=>y.target===d);return `<div class="lrow"><div class="lhd"><span><b style="font-weight:500">${esc(d)}</b> ${st(appSt(d),APP_ST[appSt(d)])}</span>
        ${LIVE?(b?`<button class="btn sm" data-unbridge="${esc(d)}">Clear bridge</button>`:appSt(d)==="MIGRATED"?"":`<button class="btn sm" data-bridge="${esc(d)}">Record bridge</button>`):""}</div>
        <div class="small">${b?`${st("BRIDGE_AGREED")} <span class="muted">${esc(b.by_name)}:</span> ${esc(b.note)}`:appSt(d)==="MIGRATED"?'<span class="muted">Already on Google Cloud, no bridge needed.</span>':'<span class="muted">No bridge recorded.</span>'}</div></div>`}).join("")}`:""));
  closeBind("#daPanel",()=>{UI.daSel=null;bDepApps()});
  const g=id=>$("#"+id);
  if(g("daGo"))g("daGo").onclick=async e=>{e.target.disabled=true;try{await api(`/api/v1/projects/${pid}/applications/${app}/migration-status`,{status:g("daSt").value,by:g("daBy").value,note:g("daNote").value});
    await refresh({k:"ok",html:`Status recorded for ${esc(x.application)}.${g("daSt").value!=="NOT_STARTED"?" E-mail drafts are on Stakeholders.":""}`})}catch(er){e.target.disabled=false;g("daErr").textContent=er.message}};
  $("#daPanel").querySelectorAll("[data-bridge]").forEach(b=>b.onclick=()=>{const d=b.dataset.bridge;
    show(`Bridge for ${d}`,`<form id="brForm" novalidate><div id="brErr"></div><p class="small muted" style="margin-bottom:8px">${esc(d)} reads data from ${esc(x.application)} and stays on AWS for now. Record how it keeps working during the cutover, as agreed with its owner.</p>
      <label class="fld"><span>${esc(d)} owner who agreed</span><input type="text" name="by"></label>
      <label class="fld"><span>The arrangement (at least 10 characters)</span><textarea name="note" rows="3" style="width:100%;height:auto;padding:6px 8px" placeholder="For example: reads a copy replicated back to the AWS bucket for two weeks"></textarea></label>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn" type="button" onclick="$('#dlg').close()">Cancel</button><button class="btn primary" type="submit" id="brGo">Record bridge</button></div></form>`);
    $("#brForm").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);$("#brGo").disabled=true;
      try{await api(`/api/v1/projects/${pid}/applications/${app}/bridges/${encodeURIComponent(d)}`,{by:String(f.get("by")),note:String(f.get("note"))});$("#dlg").close();await refresh({k:"ok",html:`Bridge recorded for ${esc(d)}.`})}
      catch(er){$("#brGo").disabled=false;$("#brErr").innerHTML=`<div class="flash err"><div>${esc(er.message)}</div></div>`}}});
  $("#daPanel").querySelectorAll("[data-unbridge]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api(`/api/v1/projects/${pid}/applications/${app}/bridges/${encodeURIComponent(b.dataset.unbridge)}`,null,"DELETE");await refresh({k:"ok",html:"Bridge cleared."})}catch(er){b.disabled=false;toast({k:"err",html:esc(er.message)})}});
}

/* ============================================================== 5 mapping */

  const m=S.mappings, c=s=>m.filter(x=>x.approval_status===s).length;
  UI.mStat=UI.mStat||"all";UI.mTab=UI.mTab||"map";
  return head("mapping",`Each AWS resource gets a recommended Google Cloud service with the rules that fired, alternatives and constraints. Recommendations are not guaranteed equivalents, and nothing is converted until its mapping is approved.`)+
  tabs("mTabs",[["map","Mappings",m.length],["cat","Service catalogue",S.catalogue.entries]],UI.mTab)+`<div id="mBody"></div>`;
}
function bMapping(){onTabs("mTabs",v=>{UI.mTab=v;mBody()});mBody()}
function mBody(){
  if(UI.mTab==="cat"){
    $("#mBody").innerHTML=`<div class="toolbar"><input type="search" id="catQ" placeholder="Find a service, for example Kinesis or Oracle" value="${esc(UI.catQ||"")}"><span class="small muted">Catalogue ${esc(S.catalogue.version)}</span></div><div class="box" id="catOut"></div>`;
    const draw=()=>{const q=(UI.catQ||"").toLowerCase(),hit=S.catalogue.services.filter(s=>!q||s.toLowerCase().includes(q));
      $("#catOut").innerHTML=hit.length?`<div class="catgrid">${hit.map(s=>`<div>${q?esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"),x=>`<mark>${x}</mark>`):esc(s)}</div>`).join("")}</div>`:`<div class="bd muted">No service matches "${esc(q)}". It is not in this catalogue version.</div>`};
    $("#catQ").oninput=e=>{UI.catQ=e.target.value;draw()};draw();return}
  const m=S.mappings, c=s=>m.filter(x=>x.approval_status===s).length;
  $("#mBody").innerHTML=`<div class="toolbar">${seg("mStat",[["all","All",m.length],["PENDING","Pending",c("PENDING")],["APPROVED","Approved",c("APPROVED")],["REJECTED","Rejected",c("REJECTED")]],UI.mStat)}
   <label class="inline">Strategy <select id="mStr"><option value="">All strategies</option>${Object.keys(S.plan.seven_rs).map(r=>`<option ${UI.mStr===r?"selected":""}>${r}</option>`).join("")}</select></label><span class="grow"></span>
   <input type="search" id="mQ" placeholder="Find a resource or service" value="${esc(UI.mQ||"")}"></div>
   <div class="split wide"><div id="mTbl"></div><aside class="panel" id="mPanel"></aside></div>`;
  const name=id=>(S.discovery.resources.find(r=>r.resource_id===id)||{}).name||id;
  const draw=()=>{const q=(UI.mQ||"").toLowerCase();
    const rows=m.filter(x=>(UI.mStat==="all"||x.approval_status===UI.mStat)&&(!UI.mStr||x.strategy===UI.mStr)&&(!q||(name(x.resource_id)+x.aws_service+x.target_service).toLowerCase().includes(q)));
    mountTable("#mTbl","tMap",rows,[
      {k:"resource_id",l:"Resource",s:x=>name(x.resource_id),r:x=>`<b style="font-weight:500">${esc(name(x.resource_id))}</b><div class="small muted mono">${esc(x.resource_id)}</div>`},
      {k:"aws_service",l:"AWS"},{k:"target_service",l:"Google Cloud"},{k:"strategy",l:"Strategy"},{k:"effort",l:"Effort",s:x=>"SMLX".indexOf(x.effort[0])+x.effort.length},
      {k:"score",l:"Fit",num:true},{k:"approval_status",l:"Status",r:x=>st(x.approval_status)}],
      {key:r=>r.resource_id,sort:UI.mStat==="all"?"approval_status":null,dir:-1,onSelect:r=>{UI.mSel=r.resource_id;draw();mPanel(r)},selected:UI.mSel})};
  onSeg("mStat",v=>{UI.mStat=v;TS.tMap&&(TS.tMap.p=0);draw()});$("#mStr").onchange=e=>{UI.mStr=e.target.value;draw()};$("#mQ").oninput=e=>{UI.mQ=e.target.value;draw()};
  draw();
  const sel=m.find(x=>x.resource_id===UI.mSel);sel?mPanel(sel):$("#mPanel").innerHTML=panelEmpty("Select a mapping to see why it was recommended and to approve or reject it.");
}
function mPanel(m){
  const r=S.discovery.resources.find(x=>x.resource_id===m.resource_id)||{};
  const apr=S.approvals.filter(a=>a.object_id===m.mapping_id).slice(-1)[0];
  $("#mPanel").innerHTML=panel(`${esc(m.aws_service)} to ${esc(m.target_service)}`,`${esc(r.name||m.resource_id)} · ${st(m.approval_status)}`,
    kv([["Strategy",`${esc(m.strategy)}<div class="small muted">${esc(S.plan.seven_rs[m.strategy]||"")}</div>`],["Fit score",`${m.score} of 100`],["Effort",esc(m.effort)],
      ["Known gap",m.gap?st("REVIEW",m.gap):""],["Why pending",esc(m.hold_reason)],["Migration tools",esc((m.migration_tools||[]).join("; "))],
      ["Documentation",m.doc?`<a href="${esc(m.doc)}" target="_blank" rel="noopener">${esc(m.doc.replace("https://",""))}</a>`:""],["Catalogue",esc(m.catalogue_version)]])+
    `<h3>Why this recommendation</h3>${list(m.rationale)}
     <h3>Alternatives</h3>${m.alternatives.length?`<div class="tw"><table><thead><tr><th>Service</th><th>Consider when</th></tr></thead><tbody>${m.alternatives.map(a=>`<tr><td>${esc(a.service)}</td><td class="small">${esc(a.when)}</td></tr>`).join("")}</tbody></table></div>`:'<p class="small muted">None listed.</p>'}
     <h3>Constraints to check</h3><p class="small">${esc(m.constraints.join(", "))}</p>
     ${apr?`<h3>Last decision</h3>${kv([["Decision",st(apr.decision)],["By",esc(apr.approver)],["When",esc(String(apr.created_at).replace("T"," ").slice(0,16))],["Rationale",esc(apr.rationale)]])}`:""}
     <div class="form">${LIVE?`<h3 style="margin:0 0 8px">Record a decision</h3><label class="fld"><span>Approver</span><input type="text" id="mWho" autocomplete="name" placeholder="Name and role"></label>
       <label class="fld"><span>Rationale</span><textarea id="mWhy" rows="3" placeholder="Why this target is right, or what must change"></textarea></label>
       <div class="row"><button class="btn primary" id="mApv">Approve mapping</button><button class="btn danger" id="mRej">Reject</button></div><div id="mErr" class="small" style="color:var(--fail);margin-top:6px"></div>`:roNote("Approving a mapping")}</div>`);
  closeBind("#mPanel",()=>{UI.mSel=null;mBody()});
  if(LIVE){const act=async d=>{const who=$("#mWho").value.trim(),why=$("#mWhy").value.trim();if(!who||!why){$("#mErr").textContent="Enter the approver and a rationale.";return}
      $("#mApv").disabled=$("#mRej").disabled=true;
      try{await api(`/api/v1/mappings/${m.mapping_id}/approve`,{approver:who,decision:d,rationale:why});await refresh({k:"ok",html:`${d==="APPROVED"?"Approved":"Rejected"} ${esc(m.aws_service)} to ${esc(m.target_service)}. Readiness scores were recalculated.`})}
      catch(e){$("#mErr").textContent=e.message;$("#mApv").disabled=$("#mRej").disabled=false}};
    $("#mApv").onclick=()=>act("APPROVED");$("#mRej").onclick=()=>act("REJECTED")}
}

/* ============================================================== 6 conversion */
function vConversion(){
  const c=S.conversions;
  const keep=c.find(x=>x.id===UI.cSel||(x.history||[]).some(h=>h.id===UI.cSel));   // a new version keeps the selection
  UI.cSel=keep?keep.id:(c[0]&&c[0].id);
  return head("conversion","Converters write to a separate, versioned output area. Source files are never modified and nothing is deployed. Every output waits for engineering review.",
    `<button class="btn" id="cZipAll">Download all outputs (.zip)</button>`)+`
  <div class="cols" style="grid-template-columns:300px minmax(0,1fr);align-items:start">
   <div class="box"><div class="hd"><h2>Artefacts</h2><span class="note">${c.length}</span></div><ul class="flist" id="cList" role="listbox" aria-label="Converted artefacts">${c.map(x=>{const fails=x.checks.filter(k=>k.status==="FAIL").length,warns=x.checks.filter(k=>k.status!=="PASS").length+x.unsupported.length;
     return `<li role="option" tabindex="0" data-id="${esc(x.id)}" aria-selected="${x.id===UI.cSel}"><div class="f">${esc(x.source_file)}</div><div class="m"><span>${esc(x.converter)}</span></div>
     <div class="m"><span class="barcell" title="Share of constructs the conversion rules handled. It is not a measure of correctness." style="grid-template-columns:70px 30px">${bar(x.confidence*100,x.confidence<.75?"review":"pass")}<span>${x.confidence}</span></span>${fails?st("FAIL",`${fails} failed`):(x.test_summary||{}).FAIL?st("FAIL",`${x.test_summary.FAIL} test${x.test_summary.FAIL>1?"s":""} failed`):warns?st("REVIEW",`${warns} to check`):st("PASS","Static checks pass")}</div>
     <div class="m"><span class="small muted">Version ${x.current_n||1}${x.current_kind==="EDITED"?", edited":""}</span>${st(x.approval_status==="PENDING_REVIEW"?"PENDING":x.approval_status,x.approval_status==="PENDING_REVIEW"?"Awaiting review":null)}</div></li>`}).join("")}</ul></div>
   <div id="cWork"></div></div>`;
}
function bConversion(){
  const pick=id=>{UI.cSel=id;$$("#cList li").forEach(l=>l.setAttribute("aria-selected",l.dataset.id===id));cWork()};
  $$("#cList li").forEach(l=>{l.onclick=()=>pick(l.dataset.id);l.onkeydown=e=>{if(e.key==="Enter")pick(l.dataset.id);if(e.key==="ArrowDown"&&l.nextElementSibling){l.nextElementSibling.focus();pick(l.nextElementSibling.dataset.id)}if(e.key==="ArrowUp"&&l.previousElementSibling){l.previousElementSibling.focus();pick(l.previousElementSibling.dataset.id)}}});
  $("#cZipAll").onclick=()=>{const files={};S.conversions.forEach(c=>Object.entries(c.outputs).forEach(([k,v])=>files[k]=v));downloadZip("gcp_converted_outputs.zip",files)};
  cWork();
}
function codeBlock(text,hl){const lines=String(text??"").split("\n");const h=new Set(hl||[]);
  return `<div class="code"><div class="ln">${lines.map((_,i)=>i+1).join("<br>")}</div><div class="src">${lines.map((l,i)=>h.has(i+1)?`<span class="hl">${esc(l)||" "}</span>`:esc(l)).join("\n")}</div></div>`}
function cWork(){
  const c=S.conversions.find(x=>x.id===UI.cSel);if(!c){$("#cWork").innerHTML="";return}
  const outs=Object.keys(c.outputs).sort((a,b)=>c.outputs[b].length-c.outputs[a].length);
  UI.cOut=outs.includes(UI.cOut)?UI.cOut:outs[0];UI.cTab=UI.cTab||"code";
  const hl=c.mapping_log.map(x=>x.line).filter(Boolean);
  const f=x=>`${x.length}`;
  $("#cWork").innerHTML=`<div class="box"><div class="hd"><div><h2 class="mono" style="font-size:14px">${esc(c.source_file)}</h2><div class="small muted">${esc(c.converter)} ${esc(c.version)} · ${esc(c.application||"")} · ${c.constructs_converted} of ${c.constructs_total} constructs converted</div></div>
   <div style="display:flex;gap:8px;align-items:center"><span class="small muted">Version ${c.current_n||1} of ${(c.history||[]).length||1}${c.current_kind==="EDITED"?`, edited by ${esc(c.edited_by)}`:""}</span>${tag(c.approval_status==="PENDING_REVIEW"?"PENDING":c.approval_status,c.approval_status==="PENDING_REVIEW"?"Awaiting review":null)}<button class="btn sm" id="cZip">Download (.zip)</button></div></div>
   <div class="flash info" style="margin:0 14px 10px"><div><b>Not run on Google Cloud.</b> Checks and generated tests read the files; nothing has been executed or deployed, so a pass here does not prove it works.</div></div>
   <div style="padding:0 14px">${tabs("cTabs",[["code","Code"],["tests","Tests",(c.tests||[]).length],["find","Findings",c.warnings.length+c.unsupported.length+c.manual_actions.length],["checks","Checks",c.checks.length],["ver","Versions and review",(c.history||[]).length],["log","Rule log",c.mapping_log.length]],UI.cTab)}</div>
   <div id="cBody"></div></div>`;
  onTabs("cTabs",v=>{UI.cTab=v;cBody(c,outs,hl)});
  $("#cZip").onclick=()=>downloadZip(c.source_file.replace(/\W+/g,"_")+"_gcp.zip",{...c.outputs,...(c.test_files||{})});
  cBody(c,outs,hl);
}
function cBody(c,outs,hl){
  const el=$("#cBody");
  if(UI.cTab==="code"){
    el.innerHTML=`<div class="filetabs" role="tablist">${outs.map(o=>`<button role="tab" data-o="${esc(o)}" aria-selected="${o===UI.cOut}">${esc(o.split("/").pop())}</button>`).join("")}</div>
    <div class="codepair"><div><div class="cap"><span>AWS source · <span class="mono">${esc(c.source_file)}</span></span><span class="small muted">${hl.length?`${hl.length} changed lines highlighted`:""}</span></div>${c.source_text?codeBlock(c.source_text,hl):'<div class="bd muted" style="padding:12px">Data file, no source text shown.</div>'}</div>
    <div><div class="cap"><span>Google Cloud · <span class="mono">${esc(UI.cOut)}</span></span><span style="display:flex;gap:6px">${LIVE&&c.history&&c.history.length&&c.history[c.history.length-1].has_content?`<button class="btn sm" id="cEdit">Edit</button>`:""}<button class="btn sm" id="cDl">Download file</button></span></div>${codeBlock(c.outputs[UI.cOut])}</div></div>`;
    $$(".filetabs button",el).forEach(b=>b.onclick=()=>{UI.cOut=b.dataset.o;cBody(c,outs,hl)});
    $("#cDl").onclick=()=>download(UI.cOut.split("/").pop(),c.outputs[UI.cOut]);
    const ce=$("#cEdit");if(ce)ce.onclick=()=>codeEditDlg(c,UI.cOut);

function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function downloadZip(name,files){ // store-only zip, no compression
  const enc=new TextEncoder(),crcT=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crcT[n]=c>>>0}
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  const parts=[],central=[];let off=0;
  const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
  Object.entries(files).forEach(([p,t])=>{const nb=enc.encode(p),db=enc.encode(t),cr=crc(db);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length});
  const cs=central.reduce((a,b)=>a+b.length,0),n=Object.keys(files).length;
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(n),...u16(n),...u32(cs),...u32(off),...u16(0)]);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([...parts,...central,end],{type:"application/zip"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ============================================================== journey */
function journey(){
  const s=S.migration.story, has=k=>s.find(x=>x.step.startsWith(k));
  const runs=S.migration.runs, first=runs.find(r=>r.run_type==="FULL_HISTORICAL_BACKFILL");
  const retry=first&&first.batches.some(b=>b.attempt>1);
  const v1=has("VALIDATE (post-load)"), fin=has("FINAL CUTOVER"), cust=has("CUSTOMER"), k=S.kpis;
  const S_=[
    ["Plan",has("PLAN")?"pass":"",has("PLAN")?`${S.migration.backfill_plan.batches.length} monthly batches`:"Not started"],
    ["Approve",has("APPROVE")?"pass":"","Load blocked until approved"],
    ["Baseline",has("PROFILE")?"pass":"",has("PROFILE")?`${fmt(has("PROFILE").rows)} rows captured`:""],
    ["Extract",first?"pass":"",first?`${fmt(first.totals.rows_extracted)} rows with checksums`:""],
    ["Transfer",retry?"recovered":first?"pass":"",retry?"Checksum mismatch, retried":"Integrity verified"],
    ["Load",first?"pass":"",first?`${fmt(first.totals.rows_loaded)} loaded, ${first.totals.rows_rejected} quarantined`:""],
    ["Merge",has("CATCH UP")?"pass":"","Partition replace and MERGE"],
    ["Catch up",has("CDC")?"pass":"",has("CDC")?"Watermark and CDC, replay-safe":""],
    ["Validate",fin?((cust&&cust.status==="FAIL")||fin.status==="FAIL"?"fail":fin.status==="PASS"?(v1&&v1.status==="FAIL"?"recovered":"pass"):"review"):"",fin?`Orders ${fin.status.toLowerCase()}, customer ${cust?cust.status.toLowerCase():"not run"}`:""],
    ["Re-run",has("REMEDIATE")?"pass":"",has("REMEDIATE")?`${has("REMEDIATE").partitions.length} partitions reloaded`:""],
    ["Sign off",k.apps_blocked?"fail":"pass",k.apps_blocked?`${k.apps_blocked} of ${k.apps_total} apps blocked`:"Ready"]];
  return `<div class="journey"><div class="hd"><h2>Historical load of ${esc(S.migration.backfill_plan.target_object)}</h2>
   <div class="legend"><span><i style="background:var(--pass)"></i>Passed</span><span><i style="background:#c98a1a"></i>Needs review</span><span><i style="background:var(--fail)"></i>Failed or blocked</span><span><i style="background:linear-gradient(90deg,var(--fail) 0 30%,var(--pass) 30%)"></i>Failed, then recovered</span><span><i style="background:var(--rule)"></i>Not reached</span></div></div>
   <ol>${S_.map(([n,c,e],i)=>`<li class="${c}"><div class="k">Step ${i+1}</div><div class="t">${esc(n)}</div><div class="e">${esc(e)}</div></li>`).join("")}</ol></div>`;
}

  const f=(k,l,o={})=>`<label class="fld ${o.wide?"wide":""}" id="f_${k}"><span>${l}${o.req?" (required)":""}</span><input type="text" name="${k}" value="${esc(o.v||"")}" ${o.ph?`placeholder="${esc(o.ph)}"`:""} autocomplete="off">${o.hint?`<small>${o.hint}</small>`:""}<i class="fe" hidden></i></label>`;
  const sel=(k,l,opts,v)=>`<label class="fld" id="f_${k}"><span>${l}</span><select name="${k}">${opts.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}</select><i class="fe" hidden></i></label>`;
  return `<div class="crumbs">Projects</div><div class="pagehead"><div><h1>New project</h1><p class="desc">One project per application or pipeline you are migrating. Account and project details are labels for the reports; the tool does not connect to AWS or Google Cloud.</p></div></div>
  <form id="npForm" novalidate style="max-width:760px;border:1px solid var(--rule);border-radius:var(--r2);padding:16px;background:var(--surface)">
   <div id="npErr"></div>
   <div class="fgrid">${f("name","Project name",{req:1,wide:1,ph:"Retail orders, AWS to Google Cloud"})}
    ${f("application","Application name",{ph:"RetailOrders",hint:"A label for this project. Resources are grouped by the application tag found in your files."})}${f("customer","Customer or business unit")}
    ${f("owner","Migration owner",{ph:"Name and team"})}${sel("environment","Environment",["Prod","Non-prod","Dev","Test"],"Prod")}
    ${sel("criticality","Business criticality",["Low","Medium","High","Critical"],"Medium")}<span></span>
    ${f("aws_account","AWS account ID",{ph:"12 digits",hint:"Optional."})}${f("aws_region","AWS region",{v:"us-east-1"})}
    ${f("gcp_project","GCP project ID",{ph:"my-migration-project",hint:"Lowercase letters, digits and hyphens."})}${f("gcp_region","GCP region",{v:"us-east1"})}</div>
   <div style="display:flex;gap:8px;margin-top:6px"><button class="btn primary" type="submit" id="npGo">Create project</button><a class="btn" href="#overview">Cancel</a></div>
  </form>`;
}
function bNew(){
  const form=$("#npForm");
  form.onsubmit=async e=>{e.preventDefault();
    $$("#npForm label.fld").forEach(l=>{l.classList.remove("bad");const i=l.querySelector(".fe");if(i)i.hidden=true});$("#npErr").innerHTML="";
    const body={};new FormData(form).forEach((v,k)=>{body[k]=String(v).trim()});
    const bad=(k,m)=>{const l=$("#f_"+k);if(l){l.classList.add("bad");const i=l.querySelector(".fe");i.textContent=m;i.hidden=false}};
    if(!LIVE){$("#npErr").innerHTML=`<div class="flash err"><div>Creating a project needs the live API. Start <code>uvicorn accelerator.api:app</code>.</div></div>`;return}
    if(body.name.length<3){bad("name","Enter a project name of at least 3 characters.");$("#npErr").innerHTML=`<div class="flash err"><div>Check the highlighted fields.</div></div>`;form.querySelector("[name=name]").focus();return}
    $("#npGo").disabled=true;$("#npGo").textContent="Creating";
    try{const r=await api("/api/v1/projects",body);setPid(r.id);Object.keys(UI).forEach(k=>delete UI[k]);Object.keys(TS).forEach(k=>delete TS[k]);
      await refresh();FLASH={k:"ok",html:`Project <b>${esc(r.name)}</b> created. Add the files that describe the application.`};location.hash="#uploads"}
    catch(er){$("#npGo").disabled=false;$("#npGo").textContent="Create project";
      if(er.errors)Object.entries(er.errors).forEach(([k,m])=>bad(k,m));
      $("#npErr").innerHTML=`<div class="flash err"><div>${esc(er.message)}</div></div>`;const first=form.querySelector(".fld.bad input,.fld.bad select");if(first)first.focus()}};
  form.querySelector("[name=name]").focus();
}

/* ============================================================== render */
const VIEWS={availability:[vAvail,bAvail],new:[vNew,bNew],overview:[vOverview,bOverview],uploads:[vUploads,bUploads],discovery:[vDiscovery,bDiscovery],dependencies:[vDeps,bDeps],mapping:[vMapping,bMapping],
  conversion:[vConversion,bConversion],plan:[vPlan,bPlan],loads:[vLoads,bLoads],validation:[vValidation,bValidation],readiness:[vReadiness,bReadiness],
  stakeholders:[vStakeholders,bStakeholders],audit:[vAudit,bAudit]};
function render(){
  const p=S.project;
  $("#pname").textContent=p.name;$("#simChip").hidden=!isSim();$("#pmeta").textContent=`${p.aws_region} to ${p.gcp_region}`;
  const pl=S.projects||[];
  $("#projPop").innerHTML=(LIVE&&pl.length?`<h3 style="margin-bottom:6px">Projects</h3><ul class="plist">${pl.map(x=>`<li><button type="button" data-pid="${esc(x.id)}" aria-current="${x.id===p.id}"><span class="n">${esc(x.name)}</span><span class="m">${x.is_sample?"Sample":esc(human(x.status))}</span></button></li>`).join("")}</ul>
    <p style="margin:0 0 12px"><a class="btn sm" href="#new" id="newBtn">New project</a></p>`:"")+`<h3 style="margin-bottom:8px">${esc(p.name)}</h3>${kv([["Customer",esc(p.customer)],["Owner",esc(p.owner)],["AWS account",esc(p.aws_account)],["AWS region",esc(p.aws_region)],["GCP project",esc(p.gcp_project)],["GCP region",esc(p.gcp_region)],["Environment",esc(p.config.environment)],["Criticality",esc(p.config.criticality)],["Application",esc(p.config.application)],["Bandwidth",p.config.bandwidth_mbps?`${fmt(p.config.bandwidth_mbps)} Mbps`:""],["Catalogue",`${esc(S.catalogue.version)}, ${S.catalogue.entries} services`],["Project ID",`<span class="mono">${esc(p.id)}</span>`]])}`;
  $("#mode").className="mode"+(LIVE?" live":"");$("#mode span").textContent=LIVE?"Live":"Snapshot, read-only";
  $("#btnReset").hidden=!(LIVE&&isSample());
  $("#btnReport").href=LIVE?"/api/v1/reports/migration_readiness_report.html"+pq():"reports/migration_readiness_report.html";
  $("#btnReport").hidden=!((S.reports||[]).some(x=>/migration_readiness_report\.html$/.test(x)));
  $$("#projPop [data-pid]").forEach(b=>b.onclick=()=>{$("#projPop").classList.remove("on");if(b.dataset.pid!==p.id)switchTo(b.dataset.pid)});
  const nb=$("#newBtn");if(nb)nb.onclick=()=>$("#projPop").classList.remove("on");
  renderNav();
  const r=route();
  let [v,b]=VIEWS[r];
  const st_=S.stages||{assessed:true,data_migration:true,sample:true};
  if(!st_.assessed&&r==="overview"){v=vStart;b=bStart}
  else if(!st_.assessed&&!["uploads","new","audit","availability"].includes(r)){v=()=>vEmpty(r,"Nothing to show yet","This screen is filled in by the assessment. Add your AWS files on Uploads, then run the assessment.",[["Go to Uploads","#uploads"]]);b=()=>{}}
  else if(!st_.data_migration&&r==="loads"){v=()=>vEmpty(r,"No data has been loaded or compared","This project has files and an assessment, but no source or target data was connected, so nothing was loaded and nothing was reconciled. Reconciliation results are never shown for a project that has none.",[["Back to Overview","#overview"]]);b=()=>{}}
  document.title=`${TITLES[r][1]} · Migration Accelerator`;
  $("#main").innerHTML=v();b();
  FLASH=null;
}
window.addEventListener("hashchange",()=>{render();const m=$("#main");m.classList.remove("enter");void m.offsetWidth;m.classList.add("enter");$("#main").focus({preventScroll:true});window.scrollTo(0,0)});
window.addEventListener("resize",()=>{if(route()==="dependencies")fitG()});
$("#projBtn").onclick=e=>{e.stopPropagation();const on=$("#projPop").classList.toggle("on");$("#projBtn").setAttribute("aria-expanded",on)};
document.addEventListener("click",e=>{if(!e.target.closest(".proj")){$("#projPop").classList.remove("on");$("#projBtn").setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#projPop").classList.remove("on")});
$("#btnReset").onclick=async()=>{if(!confirm("Reset the demo run? Approvals and waivers made in this session will be replaced by a fresh run."))return;
  $("#btnReset").disabled=true;$("#btnReset").textContent="Resetting";await fetch("/api/v1/demo/run",{method:"POST"});$("#btnReset").textContent="Reset demo run";$("#btnReset").disabled=false;Object.keys(UI).forEach(k=>delete UI[k]);await refresh({k:"ok",html:"Demo run reset."})};

async function load(){
  if(window.__STATE__){S=window.__STATE__;LIVE=false}
  else{try{let r=await fetch("/api/v1/state"+pq());if(r.status===404&&PID){setPid("");r=await fetch("/api/v1/state")}if(!r.ok)throw new Error(r.statusText);S=await r.json();LIVE=true}
    catch(e){$("#main").innerHTML=`<div class="flash err" style="margin:24px"><div><b>No project data found.</b> Start the API with <code>uvicorn accelerator.api:app</code>, or open the exported <code>console.html</code> from a demo run.</div></div>`;return}}
  render();
}
load();
</script>
</body>
</html>
