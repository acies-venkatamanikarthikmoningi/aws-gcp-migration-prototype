<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migration Accelerator · AWS to GCP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='1' width='12' height='12' fill='none' stroke='%2320242a' stroke-width='2'/%3E%3Crect x='9' y='9' width='12' height='12' fill='%2320242a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --ink:#20242a; --ink-2:#4d5560; --ink-3:#77808b;
  --canvas:#f3f4f6; --surface:#fff; --sunken:#f8f9fa;
  --rule:#d9dde2; --rule-2:#eceef1;
  --action:#1f5aa6; --action-hover:#184b8c; --action-soft:#eaf1fa;
  --pass:#1e7b45; --pass-bg:#e8f3ec;
  --fail:#b42318; --fail-bg:#fbeae8;
  --review:#8f5400; --review-bg:#fbf1e0;
  --waived:#44597a; --waived-bg:#ebeff5;
  --neutral:#5b6470; --neutral-bg:#eef0f2;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:2px; --r2:3px;
  --top:48px; --navw:228px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--action);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:1px}
code,.mono{font-family:var(--mono);font-size:12px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:0}
h1{font-size:22px;line-height:28px}
h2{font-size:16px;line-height:22px}
h3{font-size:14px;line-height:20px}
p{margin:0}
.muted{color:var(--ink-3)}.sub{color:var(--ink-2)}.small{font-size:12px;line-height:16px}
.num{text-align:right;white-space:nowrap}
.nowrap{white-space:nowrap}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------------------------------------------------------------- shell */
.topbar{position:sticky;top:0;z-index:30;height:var(--top);background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:16px;padding:0 16px 0 0}
.brand{width:var(--navw);flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--rule)}
.brand svg{flex:none}
.brand b{font-size:14px;font-weight:600;line-height:16px}
.brand span{display:block;font-size:11px;color:var(--ink-3);line-height:14px}
.proj{display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.proj>button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:var(--r);padding:5px 8px;cursor:pointer;min-width:0}
.proj>button:hover{border-color:var(--rule);background:var(--sunken)}
.proj .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .pmeta{color:var(--ink-3);font-size:12px;white-space:nowrap}
.popover{position:absolute;top:calc(100% + 6px);left:0;width:380px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);box-shadow:0 8px 24px rgba(32,36,42,.12);padding:14px 16px;display:none;z-index:40}
.popover.on{display:block}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.mode{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:0 8px}
.mode i{width:7px;height:7px;border-radius:1px;background:var(--neutral)}
.mode.live i{background:var(--pass)}

.shell{display:grid;grid-template-columns:var(--navw) minmax(0,1fr);min-height:calc(100vh - var(--top))}
nav.side{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;padding:10px 0 20px}
nav.side .grp{padding:14px 16px 4px;font-size:12px;font-weight:600;color:var(--ink-3)}
nav.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 6px 14px;color:var(--ink);border-left:2px solid transparent;text-decoration:none;font-size:14px}
nav.side a:hover{background:var(--sunken)}
nav.side a[aria-current=page]{border-left-color:var(--action);background:var(--action-soft);color:var(--action);font-weight:500}
nav.side .cnt{font-size:12px;color:var(--ink-3);font-weight:400}
nav.side .cnt.bad{color:var(--fail);font-weight:600}
nav.side .cnt.warn{color:var(--review);font-weight:600}
nav.side .foot{margin:18px 16px 0;padding-top:12px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--ink-3);line-height:16px}

main{min-width:0;padding:16px 24px 64px}
.crumbs{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.pagehead .desc{color:var(--ink-2);margin-top:4px;max-width:78ch}
.pagehead .acts{display:flex;gap:8px;flex:none;padding-top:2px}
.flash{display:flex;gap:10px;align-items:flex-start;border:1px solid;border-radius:var(--r2);padding:9px 12px;margin-bottom:12px;font-size:13px}
.flash.ok{border-color:#b8d9c4;background:var(--pass-bg)}
.flash.err{border-color:#f0c2bd;background:var(--fail-bg)}
.flash.info{border-color:#c9d6e8;background:var(--action-soft)}
.flash button{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-2);padding:0 2px;font-size:16px;line-height:1}

/* ---------------------------------------------------------------- controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--sunken);border-color:#c5cad1;text-decoration:none}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}
.btn.primary:hover{background:var(--action-hover)}
.btn.danger{color:var(--fail)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=search],input[type=text],input[type=date],select,textarea{height:32px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);padding:0 8px}
textarea{height:auto;padding:6px 8px;resize:vertical;width:100%}
input[type=search]{min-width:240px}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:3px}
label.fld input,label.fld select{width:100%}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.toolbar .grow{flex:1}
.toolbar label.inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}

/* segmented filter with counts */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--rule);background:none;padding:0 10px;height:30px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button b{font-weight:600;color:var(--ink);margin-left:4px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg button[aria-pressed=true] b{color:#fff}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:12px}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .c{color:var(--ink-3);font-weight:400;margin-left:4px}

/* status indicator */
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.st::before{content:"";width:8px;height:8px;border-radius:1px;flex:none;background:currentColor}
.st.pass{color:var(--pass)}.st.fail{color:var(--fail)}.st.review{color:var(--review)}.st.waived{color:var(--waived)}.st.neutral{color:var(--neutral)}.st.info{color:var(--action)}
.tag{display:inline-block;border:1px solid;border-radius:var(--r);padding:0 6px;font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
.tag.pass{color:var(--pass);border-color:#b8d9c4;background:var(--pass-bg)}
.tag.fail{color:var(--fail);border-color:#f0c2bd;background:var(--fail-bg)}
.tag.review{color:var(--review);border-color:#ecd3a8;background:var(--review-bg)}
.tag.waived{color:var(--waived);border-color:#cdd6e3;background:var(--waived-bg)}
.tag.neutral{color:var(--neutral);border-color:var(--rule);background:var(--neutral-bg)}

/* containers */
.box{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2)}
.box>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule-2)}
.box>.hd .note{font-size:12px;color:var(--ink-3)}
.box>.bd{padding:12px 14px}
.box+.box,.box+.sect,.sect+.box,.sect+.sect{margin-top:16px}
.sect>h2{margin-bottom:8px}
.cols>.box,.cols>.sect,.cols>div{margin-top:0}
.cols{display:grid;gap:16px}
.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* key-value */
dl.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 16px;margin:0;font-size:13px}
dl.kv dt{color:var(--ink-3)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
dl.kv dd .st{white-space:normal;align-items:baseline}
dl.kv dd .st::before{transform:translateY(-1px)}
.trunc{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.toast{position:fixed;top:calc(var(--top) + 12px);right:16px;z-index:50;max-width:440px;box-shadow:0 8px 24px rgba(32,36,42,.14)}

/* summary metrics row */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2)}
.metrics>div{padding:10px 14px;border-right:1px solid var(--rule-2)}
.metrics>div:last-child{border-right:0}
.metrics .v{font-size:20px;line-height:26px;font-weight:600}
.metrics .l{font-size:12px;color:var(--ink-2)}
.metrics .v.fail{color:var(--fail)}.metrics .v.pass{color:var(--pass)}.metrics .v.review{color:var(--review)}

/* tables */
.tw{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);overflow:auto}
.tw.flush{border:0;border-radius:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{position:sticky;top:0;background:var(--sunken);color:var(--ink-2);font-weight:600;font-size:12px;border-bottom:1px solid var(--rule);white-space:nowrap;z-index:1}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .arr{display:inline-block;width:10px;color:var(--ink-3);margin-left:2px}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#f6f8fb}
tbody tr.sel td{background:var(--action-soft)}
tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--action)}
td.empty{color:var(--ink-3);padding:20px 12px;text-align:center}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--ink-2);background:var(--surface)}
.pager .pgb{display:flex;gap:4px}

/* split view */
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr) 460px}
.split.solo{grid-template-columns:minmax(0,1fr)}
.split.solo>.panel{display:none}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);position:sticky;top:calc(var(--top) + 16px);max-height:calc(100vh - var(--top) - 32px);overflow:auto}
.panel .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--rule-2);position:sticky;top:0;background:var(--surface);z-index:2}
.panel .ph .x{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1;padding:0 2px}
.panel .pb{padding:12px 14px}
.panel .pb h3{margin:14px 0 6px}
.panel .pb h3:first-child{margin-top:0}
.panel .empty{padding:28px 16px;color:var(--ink-3);text-align:center;font-size:13px}
.panel ul{margin:0;padding-left:18px;font-size:13px}
.panel li{margin:2px 0}
.form{border-top:1px solid var(--rule-2);margin-top:14px;padding-top:12px}
.form .row{display:flex;gap:8px}
.ro-note{font-size:12px;color:var(--ink-3);border:1px dashed var(--rule);border-radius:var(--r);padding:8px 10px}

/* lists */
.attn{list-style:none;margin:0;padding:0}
.attn li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--rule-2)}
.attn li:last-child{border-bottom:0}
.attn .sq{width:8px;height:8px;border-radius:1px;margin-top:6px}
.attn .sq.fail{background:var(--fail)}.attn .sq.review{background:var(--review)}.attn .sq.info{background:var(--action)}
.attn b{font-weight:600}
.attn .why{font-size:12px;color:var(--ink-2)}
.attn a{font-size:13px;white-space:nowrap}

.stages{list-style:none;margin:0;padding:0}
.stages li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule-2);align-items:baseline}
.stages li:last-child{border-bottom:0}
.stages .n{font-size:12px;color:var(--ink-3);font-weight:600}
.stages .t{font-weight:500}
.stages .d{font-size:12px;color:var(--ink-2)}

/* bars */
.bar{height:6px;background:var(--rule-2);border-radius:1px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink-2)}
.bar.fail i{background:var(--fail)}.bar.review i{background:#c98a1a}.bar.pass i{background:var(--pass)}.bar.action i{background:var(--action)}
.barcell{display:grid;grid-template-columns:minmax(60px,1fr) 36px;gap:8px;align-items:center}

/* journey stepper */
.journey{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);margin-bottom:16px}
.journey .hd{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--rule-2)}
.journey ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(11,minmax(0,1fr))}
.journey li{padding:9px 10px 10px;border-right:1px solid var(--rule-2);position:relative;min-width:0}
.journey li:last-child{border-right:0}
.journey li::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rule)}
.journey li.pass::before{background:var(--pass)}.journey li.fail::before{background:var(--fail)}.journey li.review::before{background:#c98a1a}
.journey li.recovered::before{background:linear-gradient(90deg,var(--fail) 0 30%,var(--pass) 30%)}
.journey .k{font-size:11px;color:var(--ink-3)}
.journey .t{font-weight:600;font-size:13px}
.journey .e{font-size:11px;line-height:14px;color:var(--ink-2);margin-top:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;display:inline-block}

/* code */
.code{display:grid;grid-template-columns:auto 1fr;font-family:var(--mono);font-size:12px;line-height:18px;background:var(--surface);overflow:auto;max-height:560px}
.code .ln{color:#a3a9b1;text-align:right;padding:8px 8px 8px 10px;user-select:none;border-right:1px solid var(--rule-2);background:var(--sunken)}
.code .src{padding:8px 12px;white-space:pre;min-width:0}
.code .src .hl{background:#fdf3d8;display:inline-block;min-width:100%}
.codepair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--rule-2)}
.codepair>div{min-width:0}
.codepair>div+div{border-left:1px solid var(--rule)}
.codepair .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--rule-2);background:var(--sunken);min-height:36px}
.filetabs{display:flex;gap:0;overflow:auto;border-bottom:1px solid var(--rule-2);background:var(--sunken)}
.filetabs button{border:0;border-right:1px solid var(--rule-2);background:none;padding:6px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.filetabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 2px 0 var(--action)}
pre.json{margin:0;background:var(--sunken);border:1px solid var(--rule-2);border-radius:var(--r);padding:8px 10px;font:12px/18px var(--mono);overflow:auto;max-height:260px;white-space:pre-wrap;overflow-wrap:anywhere}

/* conversion list */
.flist{list-style:none;margin:0;padding:0}
.flist li{padding:9px 12px;border-bottom:1px solid var(--rule-2);cursor:pointer}
.flist li:hover{background:#f6f8fb}
.flist li[aria-selected=true]{background:var(--action-soft);box-shadow:inset 2px 0 0 var(--action)}
.flist .f{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.flist .m{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);margin-top:2px}

/* batches */
.batches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.batch{border:1px solid var(--rule);border-top:3px solid var(--pass);background:var(--surface);border-radius:var(--r);padding:6px 8px;text-align:left;cursor:pointer;font-size:12px;line-height:16px}
.batch:hover{border-color:#b9c0c8}
.batch.FAILED{border-top-color:var(--fail)}.batch.retried{border-top-color:#c98a1a}
.batch.sel{outline:2px solid var(--action);outline-offset:-1px}
.batch b{display:block;font-size:13px}
.batch .q{color:var(--review)}

/* graph */
.graphwrap{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r2);overflow:hidden;height:640px;cursor:grab}
.graphwrap.drag{cursor:grabbing}
#graph{width:100%;height:100%;display:block}
.gn rect.body{fill:#fff;stroke:#9aa3ad;stroke-width:1}
.gn .t1{font:500 13px var(--sans);fill:var(--ink)}
.gn .t2{font:11.5px var(--sans);fill:var(--ink-3)}
.gn.consumer rect.body{stroke:var(--ink);stroke-width:1.5}
.gn.unresolved rect.body{stroke:var(--fail);stroke-dasharray:4 3}
.gn:hover rect.body{stroke:var(--action)}
.gn.sel rect.body{stroke:var(--action);stroke-width:2}
.gn.dim{opacity:.25}
.ge{fill:none;stroke:#9aa3ad;stroke-width:1.2}
.ge.inferred{stroke:#c98a1a;stroke-dasharray:4 3}
.ge.dim{opacity:.12}
.ge.hot{stroke:var(--action);stroke-width:2;opacity:1}
.gzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
.gzoom button{width:30px;height:30px;border:0;border-bottom:1px solid var(--rule-2);background:none;cursor:pointer;font-size:16px;color:var(--ink-2)}
.gzoom button:last-child{border-bottom:0;font-size:11px}
.gcolhd{font:600 11px var(--sans);fill:var(--ink-3)}

/* email preview */
.mail{border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface)}
.mail .mh{padding:10px 14px;border-bottom:1px solid var(--rule-2);font-size:13px}
.mail .mh div{display:grid;grid-template-columns:64px 1fr;gap:8px}
.mail .mh dt{color:var(--ink-3)}
.mail .mb{padding:14px;white-space:pre-wrap;font-size:13px;line-height:20px;max-width:72ch}

/* drop zone */
.drop{display:flex;align-items:center;gap:14px;border:1px dashed #b7bec7;border-radius:var(--r2);padding:14px 16px;background:var(--surface)}
.drop.over{border-color:var(--action);background:var(--action-soft)}
.drop .dt{flex:1}

/* reconciliation summary */
.recon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface);margin-bottom:12px}
.recon>div{padding:10px 14px;border-right:1px solid var(--rule-2)}
.recon>div:last-child{border-right:0}
.recon h3{font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.recon table{font-size:13px}
.recon td{padding:2px 0;border:0}
.recon td:last-child{text-align:right;font-weight:500}
.delta-bad{color:var(--fail);font-weight:600}

.compare{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule-2);border-radius:var(--r);margin:4px 0 8px}
.compare>div{padding:8px 10px}
.compare>div+div{border-left:1px solid var(--rule-2)}
.compare .k{font-size:12px;color:var(--ink-3)}
.compare .v{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}

.waves{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface)}
.waves>div{padding:10px 12px;border-right:1px solid var(--rule-2)}
.waves>div:last-child{border-right:0}
.waves .wn{font-size:12px;color:var(--ink-3);font-weight:600}
.waves .wt{font-weight:600;margin:2px 0 4px}
.waves .wa{font-size:12px;color:var(--ink-2)}
.waves .wr{font-size:12px;color:var(--ink-3);margin-top:6px}

.dims td .bar{margin-top:6px}

details.log summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.log summary::-webkit-details-marker{display:none}
details.log summary::after{content:"Show";font-weight:400;color:var(--action);font-size:13px}
details.log[open] summary::after{content:"Hide"}
.logl{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-2)}
.logl li{display:grid;grid-template-columns:28px 210px minmax(0,1fr);gap:10px;padding:7px 14px;border-bottom:1px solid var(--rule-2);font-size:13px}
.logl li:last-child{border-bottom:0}
.logl .n{color:var(--ink-3);font-size:12px}

.catgrid{columns:4 180px;column-gap:24px;font-size:13px;padding:12px 14px}
.catgrid div{break-inside:avoid;padding:2px 0}
.catgrid mark{background:#fdf3d8;color:inherit}

dialog{border:1px solid var(--rule);border-radius:var(--r2);padding:0;width:min(560px,92vw);box-shadow:0 16px 40px rgba(32,36,42,.18)}
dialog::backdrop{background:rgba(32,36,42,.35)}
dialog .dh{padding:12px 16px;border-bottom:1px solid var(--rule-2);display:flex;justify-content:space-between}
dialog .db{padding:14px 16px}
dialog .df{padding:10px 16px;border-top:1px solid var(--rule-2);display:flex;justify-content:flex-end;gap:8px}

@media (max-width:1280px){.split,.split.wide{grid-template-columns:minmax(0,1fr) 340px}.journey ol{grid-template-columns:repeat(6,minmax(0,1fr))}.journey li:nth-child(6){border-right:0}.journey li:nth-child(n+7){border-top:1px solid var(--rule-2)}}
@media (max-width:1080px){.split,.split.wide,.c2,.c21,.c3,.codepair{grid-template-columns:1fr}.panel{position:static;max-height:none}.recon{grid-template-columns:1fr}.recon>div{border-right:0;border-bottom:1px solid var(--rule-2)}}
@media (max-width:820px){:root{--navw:0px}.brand{width:auto;border-right:0}.shell{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;flex-wrap:wrap;padding:6px}nav.side .grp,nav.side .foot{display:none}nav.side a{border-left:0;padding:6px 10px}main{padding:12px}.proj .pmeta,.mode,#btnReset{display:none!important}.brand span{display:none}.proj{min-width:0;flex:1}.top-right{margin-left:0}.btn.primary{padding:0 8px}}
@media (prefers-reduced-motion:no-preference){
  .btn,.seg button,.tabs button,nav.side a,.flist li,tbody tr.click td,.filetabs button,.batch,.proj>button{transition:background-color .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease}
  .gn,.ge{transition:opacity .16s ease,stroke .16s ease}
  #gView.anim{transition:transform .22s ease}
  .bar i{transition:width .3s ease}
  main.enter{animation:pageIn .14s ease-out}
  .panel .pb,.panel .empty{animation:panelIn .16s ease-out}
  .toast{animation:toastIn .2s ease-out}
  .popover.on{animation:panelIn .12s ease-out}
  details.log[open] .logl{animation:panelIn .16s ease-out}
}
@keyframes pageIn{from{opacity:.4}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="12" height="12" fill="none" stroke="#20242a" stroke-width="2"/><rect x="9" y="9" width="12" height="12" fill="#20242a"/></svg>
    <div><b>Migration Accelerator</b><span>AWS to Google Cloud</span></div>
  </div>
  <div class="proj">
    <button id="projBtn" aria-haspopup="true" aria-expanded="false"><span class="pname" id="pname">Loading project</span><span class="pmeta" id="pmeta"></span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="#77808b" stroke-width="1.5"/></svg></button>
    <div class="popover" id="projPop" role="dialog" aria-label="Project details"></div>
  </div>
  <div class="top-right">
    <div class="mode" id="mode"><i></i><span></span></div>
    <button class="btn" id="btnReset" hidden>Reset demo run</button>
    <a class="btn primary" id="btnReport" href="#" target="_blank" rel="noopener">Readiness report</a>
  </div>
</header>
<div class="shell">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg"><div class="dh"><h2 id="dlgT"></h2><button class="btn sm" id="dlgX">Close</button></div><div class="db" id="dlgB"></div></dialog>
<script>
"use strict";
/* ============================================================== state */
let S=null, LIVE=false, FLASH=null;
const UI={};                         // per-screen UI state survives re-render
const TS={};                         // table sort/page state
const $=s=>document.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>v==null?"":String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{if(typeof n==="number")return n.toLocaleString("en-US",{maximumFractionDigits:2});if(typeof n==="string"&&/^-?\d+(\.\d+)?$/.test(n)){const d=(n.split(".")[1]||"").length;return Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}return esc(n)};
const human=s=>{if(s==null)return"";s=String(s).replace(/_/g," ").toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};
const time=s=>s?String(s).slice(11,19):"";
const day=s=>s?String(s).slice(0,10):"";

const TONE={pass:["PASS","APPROVED","LOADED","COMPLETED","CORROBORATED","CONFIRMED","READY_FOR_SIGNOFF","ACCEPTED","Low","verified"],
  fail:["FAIL","FAILED","BLOCKED","REJECTED","CONFLICT","Critical","BLOCKED_OWNER_UNKNOWN","COMPLETED_WITH_FAILURES","CRITICAL"],
  review:["REVIEW","PENDING","PENDING_REVIEW","INFERRED","NEEDS_REVIEW","High","OPEN","CONDITIONAL","Medium","WARN","DUPLICATE","HIGH"],
  waived:["WAIVED"],info:["DRAFT","CAPTURED","RUNNING"]};
const tone=v=>{for(const[k,a]of Object.entries(TONE))if(a.includes(v))return k;return"neutral"};
const LABEL={BLOCKED_OWNER_UNKNOWN:"Owner unknown",READY_FOR_SIGNOFF:"Ready for sign-off",COMPLETED_WITH_FAILURES:"Completed with failures",INVENTORY_ONLY:"Inventory only",IAC_ONLY:"IaC only",NOT_RUN:"Not run"};
const st=(v,label)=>`<span class="st ${tone(v)}">${esc(label??LABEL[v]??human(v))}</span>`;
const tag=(v,label)=>`<span class="tag ${tone(v)}">${esc(label??LABEL[v]??human(v))}</span>`;
const bar=(pct,cls="")=>`<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;
const riskCls=s=>s>=75?"fail":s>=50?"review":"pass";
const clsCls=c=>({Critical:"fail",High:"review",Medium:"review",Low:"pass"}[c]||"action");

/* ============================================================== navigation */
const NAV=[
  [null,[["overview","Overview"]]],
  ["Assess",[["uploads","Uploads"],["discovery","Discovery"],["dependencies","Dependencies"],["mapping","Service mapping"]]],
  ["Build",[["conversion","Code conversion"]]],
  ["Move data",[["plan","Movement plan"],["loads","Load runs"],["validation","Validation"]]],
  ["Go live",[["readiness","Readiness"],["stakeholders","Stakeholders"],["audit","Reports and audit"]]]];
const TITLES=Object.fromEntries(NAV.flatMap(([g,items])=>items.map(([id,n])=>[id,[g,n]])));
const route=()=>{const h=(location.hash||"#overview").slice(1);return TITLES[h]?h:"overview"};

function navCounts(){
  const pendMap=S.mappings.filter(m=>m.approval_status==="PENDING").length;
  const lv=latestValidations(), failing=lv.filter(v=>v.status==="FAIL").length;
  const blocked=Object.values(S.risk).filter(r=>r.readiness==="BLOCKED").length;
  const unknown=S.notifications.filter(n=>n.status==="BLOCKED_OWNER_UNKNOWN").length;
  return {uploads:[S.uploads.length],discovery:[S.discovery.stats.conflicts?`${S.discovery.stats.conflicts} conflicts`:S.discovery.resources.length,S.discovery.stats.conflicts?"warn":""],
    dependencies:[S.graph.edges.length],mapping:[pendMap?`${pendMap} pending`:S.mappings.length,pendMap?"warn":""],
    conversion:[S.conversions.length],plan:[S.plan.movement.length],loads:[S.migration.runs.length],
    validation:[failing?`${failing} failing`:lv.length,failing?"bad":""],readiness:[blocked?`${blocked} blocked`:"ready",blocked?"bad":""],
    stakeholders:[unknown?`${unknown} blocked`:S.notifications.length,unknown?"warn":""],audit:[S.audit.chain.events]};
}
function renderNav(){
  const c=navCounts(), cur=route();
  $("#nav").innerHTML=NAV.map(([g,items])=>(g?`<div class="grp">${esc(g)}</div>`:"")+items.map(([id,n])=>{const[v,cl]=c[id]||[];
    return `<a href="#${id}" ${cur===id?'aria-current="page"':""}><span>${esc(n)}</span>${v!=null?`<span class="cnt ${cl||""}">${esc(v)}</span>`:""}</a>`}).join("")).join("")
    +`<div class="foot">${LIVE?"Live. Approvals and waivers made here are written to the audit log.":"Read-only snapshot of the demo run. Start the API to approve, waive or analyse files."}</div>`;
}

/* ============================================================== shared UI */
function head(id,desc,acts=""){
  const[g,n]=TITLES[id];
  return `${FLASH?`<div class="flash ${FLASH.k}" role="status"><div>${FLASH.html}</div><button aria-label="Dismiss" onclick="FLASH=null;this.parentNode.remove()">×</button></div>`:""}
  <div class="crumbs">${esc(S.project.name)}${g?" / "+esc(g):""}</div>
  <div class="pagehead"><div><h1>${esc(n)}</h1>${desc?`<p class="desc">${desc}</p>`:""}</div>${acts?`<div class="acts">${acts}</div>`:""}</div>`;
}
function seg(id,opts,cur){return `<div class="seg" role="group" id="${id}">${opts.map(([v,l,c])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${v===cur}">${esc(l)}${c!=null?`<b>${fmt(c)}</b>`:""}</button>`).join("")}</div>`}
function onSeg(id,fn){$$(`#${id} button`).forEach(b=>b.onclick=()=>{$$(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)})}
function tabs(id,opts,cur){return `<div class="tabs" role="tablist" id="${id}">${opts.map(([v,l,c])=>`<button role="tab" data-v="${esc(v)}" aria-selected="${v===cur}">${esc(l)}${c!=null?`<span class="c">${fmt(c)}</span>`:""}</button>`).join("")}</div>`}
function onTabs(id,fn){$$(`#${id} button`).forEach(b=>b.onclick=()=>{$$(`#${id} button`).forEach(x=>x.setAttribute("aria-selected",x===b));fn(b.dataset.v)})}
function panelEmpty(msg){return `<div class="empty">${esc(msg)}</div>`}
function panel(title,sub,body){return `<div class="ph"><div><h2>${title}</h2>${sub?`<div class="small muted" style="margin-top:2px">${sub}</div>`:""}</div><button class="x" aria-label="Clear selection" data-close>×</button></div><div class="pb">${body}</div>`}
function kv(pairs){return `<dl class="kv">${pairs.filter(p=>p&&p[1]!==undefined&&p[1]!==null&&p[1]!=="").map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`}
function list(items,empty="None"){return items&&items.length?`<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:`<p class="small muted">${esc(empty)}</p>`}
function show(title,html){$("#dlgT").textContent=title;$("#dlgB").innerHTML=html;$("#dlg").showModal()}
$("#dlgX").onclick=()=>$("#dlg").close();
function roNote(what){return `<div class="ro-note">${esc(what)} needs the live API. This page is a read-only snapshot; run <code>uvicorn accelerator.api:app</code> to act on it.</div>`}

/* table: cols = [{k,l,r(row),s(sortValue)|false,num,w}] */
function table(id,rows,cols,o={}){
  const t=TS[id]=TS[id]||{k:o.sort||null,d:o.dir||1,p:0};
  let rs=rows.slice();
  if(t.k){const c=cols.find(c=>c.k===t.k);if(c){const sv=c.s||(r=>r[c.k]);rs.sort((a,b)=>{const x=sv(a),y=sv(b);return(x==null)-(y==null)||(x>y?1:x<y?-1:0)*t.d})}}
  const size=o.page||25, pages=Math.max(1,Math.ceil(rs.length/size)); if(t.p>=pages)t.p=pages-1;
  const view=rs.slice(t.p*size,(t.p+1)*size);
  const key=o.key||(r=>r.id);
  const th=cols.map(c=>{const sortable=c.s!==false;const on=t.k===c.k;
    return `<th scope="col" class="${sortable?"sortable":""} ${c.num?"num":""}" ${c.w?`style="width:${c.w}"`:""} data-k="${esc(c.k)}" ${sortable?`aria-sort="${on?(t.d>0?"ascending":"descending"):"none"}"`:""}>${esc(c.l)}${sortable?`<span class="arr">${on?(t.d>0?"↑":"↓"):""}</span>`:""}</th>`}).join("");
  const tb=view.map(r=>`<tr ${o.onSelect?`class="click ${o.selected!=null&&key(r)===o.selected?"sel":""}" tabindex="0" data-key="${esc(key(r))}"`:""}>${cols.map(c=>`<td class="${c.num?"num":""}">${c.r?c.r(r):esc(r[c.k])}</td>`).join("")}</tr>`).join("");
  const html=`<div class="tw ${o.flush?"flush":""}" id="${id}"><table><thead><tr>${th}</tr></thead><tbody>${tb||`<tr><td colspan="${cols.length}" class="empty">${esc(o.empty||"No items match these filters.")}</td></tr>`}</tbody></table>
   ${rs.length>size?`<div class="pager"><span>${t.p*size+1}–${Math.min(rs.length,(t.p+1)*size)} of ${fmt(rs.length)}</span><div class="pgb"><button class="btn sm" data-pg="-1" ${t.p===0?"disabled":""}>Previous</button><button class="btn sm" data-pg="1" ${t.p>=pages-1?"disabled":""}>Next</button></div></div>`:""}</div>`;
  return {html,bind:(rerender)=>{const el=document.getElementById(id);if(!el)return;
    $$("th.sortable",el).forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(t.k===k)t.d=-t.d;else{t.k=k;t.d=1}t.p=0;rerender()});
    $$("[data-pg]",el).forEach(b=>b.onclick=()=>{t.p+= +b.dataset.pg;rerender()});
    if(o.onSelect)$$("tr.click",el).forEach(tr=>{const go=()=>{const r=rows.find(x=>String(key(x))===tr.dataset.key);o.onSelect(r)};tr.onclick=go;tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}})}};
}
function mountTable(sel,id,rows,cols,o={}){const go=()=>{const t=table(id,rows,cols,o);$(sel).innerHTML=t.html;t.bind(go)};go();}

function latestValidations(){
  const m={};S.validations.filter(v=>v.run_type!=="SOURCE_BASELINE").forEach(v=>{m[v.object]=v});return Object.values(m);
}
async function api(path,body){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}
  return r.json();
}
async function refresh(flash){const r=await fetch("/api/v1/state");S=await r.json();render();if(flash)toast(flash)}
function toast(f){const old=$(".toast");if(old)old.remove();const d=document.createElement("div");d.className=`flash ${f.k} toast`;d.setAttribute("role","status");
  d.innerHTML=`<div>${f.html}</div><button aria-label="Dismiss">×</button>`;d.querySelector("button").onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}

/* ============================================================== 1 overview */
function vOverview(){
  const k=S.kpis, risks=Object.values(S.risk), lv=latestValidations();
  const blocked=risks.filter(r=>r.readiness==="BLOCKED");
  const run=S.migration.runs.find(r=>r.run_type==="FULL_HISTORICAL_BACKFILL");
  const attn=[];
  lv.filter(v=>v.status==="FAIL").forEach(v=>attn.push(["fail",`${v.object} failed reconciliation`,`${(v.summary||{}).FAIL||0} of ${(v.summary||{}).checks||0} checks failed in ${human(v.run_type).toLowerCase()}.`,"validation",`Review checks`]));
  const keys=S.discovery.findings.filter(f=>/key|password|secret|private/i.test(f.kind));
  if(keys.length)attn.push(["fail",`${keys.length} hard-coded credential${keys.length>1?"s":""} found in code`,keys.map(f=>f.location).join(", ")+". Rotate before cutover.","discovery","View findings"]);
  const pend=S.mappings.filter(m=>m.approval_status==="PENDING");
  if(pend.length)attn.push(["review",`${pend.length} service mapping${pend.length>1?"s":""} waiting for approval`,pend.map(m=>`${m.aws_service} to ${m.target_service}`).join("; "),"mapping","Review mappings"]);
  if(S.discovery.stats.conflicts)attn.push(["review",`${S.discovery.stats.conflicts} resources have conflicting evidence`,"Sources disagree on a configuration value. Confirm the intended state.","discovery","Resolve conflicts"]);
  attn.push(["review",`${S.conversions.length} converted artefacts awaiting code review`,`Average confidence ${k.avg_conversion_confidence}. Nothing is deployed until reviewed.`,"conversion","Open workbench"]);
  const noOwner=S.stakeholders.filter(s=>!s.verified);
  if(noOwner.length)attn.push(["review",`${noOwner.length} applications have no verified owner`,noOwner.map(s=>s.application).join(", ")+". Notifications to them are blocked.","stakeholders","View owners"]);
  const drafts=S.notifications.filter(n=>n.status==="DRAFT");
  if(drafts.length)attn.push(["info",`${drafts.length} stakeholder emails drafted`,"Drafts wait for approval and are never sent automatically.","stakeholders","Read drafts"]);
  const stages=[
    ["Ingest",`${k.artefacts_uploaded} files received, ${k.artefacts_rejected} rejected as unsafe`,k.artefacts_rejected?tag("REVIEW",`${k.artefacts_rejected} rejected`):tag("PASS","Complete"),"uploads"],
    ["Discover",`${k.resources_discovered} resources, ${k.relationships} relationships`,k.conflicts?tag("REVIEW",`${k.conflicts} conflicts`):tag("PASS","Complete"),"discovery"],
    ["Map",`${k.mappings_approved} of ${k.mappings_total} approved`,k.mappings_approved<k.mappings_total?tag("REVIEW",`${k.mappings_total-k.mappings_approved} pending`):tag("PASS","Complete"),"mapping"],
    ["Convert",`${k.conversions} artefacts, avg confidence ${k.avg_conversion_confidence}`,tag("REVIEW","In review"),"conversion"],
    ["Load",run?`${fmt(run.totals.rows_loaded)} rows in ${k.batches_loaded} batches`:"Not started",run?tag("PASS","Loaded"):tag("NOT_RUN","Not started"),"loads"],
    ["Validate",lv.map(v=>`${v.object.split(".").pop()} ${v.status.toLowerCase()}`).join(", "),lv.some(v=>v.status==="FAIL")?tag("FAIL","Failing"):tag("PASS","Passing"),"validation"],
    ["Sign off",`${k.apps_total-k.apps_blocked} of ${k.apps_total} applications ready`,k.apps_blocked?tag("FAIL",`${k.apps_blocked} blocked`):tag("PASS","Ready"),"readiness"]];
  const sr=S.plan.strategy_summary, tot=Object.values(sr).reduce((a,b)=>a+b,0)||1;
  return head("overview",`${esc(S.project.customer)}. ${esc(S.project.source_cloud)} ${esc(S.project.aws_region)} to ${esc(S.project.target_cloud)} ${esc(S.project.gcp_region)}. Status ${esc(human(S.project.status).toLowerCase())}.`)+`
  <div class="flash ${blocked.length?"err":"ok"}" style="margin-bottom:16px"><div><b>${blocked.length?`Not ready for cutover. ${blocked.length} of ${risks.length} applications have open gates.`:"All applications are ready for sign-off."}</b>
   <span class="sub"> ${blocked.length?"Resolve the items in the following list to unblock sign-off.":""}</span></div></div>
  <div class="cols c21">
   <div class="box"><div class="hd"><h2>Needs attention</h2><span class="note">${attn.length} items</span></div>
    <ul class="attn">${attn.map(([s,t,w,to,l])=>`<li><span class="sq ${s}"></span><div><b>${esc(t)}</b><div class="why">${esc(w)}</div></div><a href="#${to}">${esc(l)}</a></li>`).join("")}</ul></div>
   <div class="box"><div class="hd"><h2>Progress by stage</h2></div>
    <ol class="stages">${stages.map(([t,d,s,to],i)=>`<li><span class="n">${i+1}</span><div><a href="#${to}" class="t" style="color:var(--ink)">${esc(t)}</a><div class="d">${esc(d)}</div></div>${s}</li>`).join("")}</ol></div>
  </div>
  <div class="cols c21" style="margin-top:16px">
   <div class="sect"><h2>Applications</h2><div id="ovApps"></div></div>
   <div class="sect"><h2>Migration strategy</h2>
    <div class="tw"><table><thead><tr><th>Strategy</th><th class="num">Resources</th><th style="width:45%">Share</th></tr></thead><tbody>
    ${Object.entries(S.plan.seven_rs).map(([n,d])=>`<tr title="${esc(d)}"><td>${esc(n)}<div class="small muted">${esc(d)}</div></td><td class="num">${sr[n]||0}</td><td>${bar((sr[n]||0)/tot*100,"action")}</td></tr>`).join("")}
    </tbody></table></div></div>
  </div>

function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function downloadZip(name,files){ // store-only zip, no compression
  const enc=new TextEncoder(),crcT=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crcT[n]=c>>>0}
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  const parts=[],central=[];let off=0;
  const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
  Object.entries(files).forEach(([p,t])=>{const nb=enc.encode(p),db=enc.encode(t),cr=crc(db);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length});
  const cs=central.reduce((a,b)=>a+b.length,0),n=Object.keys(files).length;
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(n),...u16(n),...u32(cs),...u32(off),...u16(0)]);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([...parts,...central,end],{type:"application/zip"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ============================================================== journey */
function journey(){
  const s=S.migration.story, has=k=>s.find(x=>x.step.startsWith(k));
  const runs=S.migration.runs, first=runs.find(r=>r.run_type==="FULL_HISTORICAL_BACKFILL");
  const retry=first&&first.batches.some(b=>b.attempt>1);
  const v1=has("VALIDATE (post-load)"), fin=has("FINAL CUTOVER"), cust=has("CUSTOMER"), k=S.kpis;
  const S_=[
    ["Plan",has("PLAN")?"pass":"",has("PLAN")?`${S.migration.backfill_plan.batches.length} monthly batches`:"Not started"],
    ["Approve",has("APPROVE")?"pass":"","Load blocked until approved"],
    ["Baseline",has("PROFILE")?"pass":"",has("PROFILE")?`${fmt(has("PROFILE").rows)} rows captured`:""],
    ["Extract",first?"pass":"",first?`${fmt(first.totals.rows_extracted)} rows with checksums`:""],
    ["Transfer",retry?"recovered":first?"pass":"",retry?"Checksum mismatch, retried":"Integrity verified"],
    ["Load",first?"pass":"",first?`${fmt(first.totals.rows_loaded)} loaded, ${first.totals.rows_rejected} quarantined`:""],
    ["Merge",has("CATCH UP")?"pass":"","Partition replace and MERGE"],
    ["Catch up",has("CDC")?"pass":"",has("CDC")?"Watermark and CDC, replay-safe":""],
    ["Validate",fin?((cust&&cust.status==="FAIL")||fin.status==="FAIL"?"fail":fin.status==="PASS"?(v1&&v1.status==="FAIL"?"recovered":"pass"):"review"):"",fin?`Orders ${fin.status.toLowerCase()}, customer ${cust?cust.status.toLowerCase():"not run"}`:""],
    ["Re-run",has("REMEDIATE")?"pass":"",has("REMEDIATE")?`${has("REMEDIATE").partitions.length} partitions reloaded`:""],
    ["Sign off",k.apps_blocked?"fail":"pass",k.apps_blocked?`${k.apps_blocked} of ${k.apps_total} apps blocked`:"Ready"]];
  return `<div class="journey"><div class="hd"><h2>Historical load of ${esc(S.migration.backfill_plan.target_object)}</h2>
   <div class="legend"><span><i style="background:var(--pass)"></i>Passed</span><span><i style="background:#c98a1a"></i>Needs review</span><span><i style="background:var(--fail)"></i>Failed or blocked</span><span><i style="background:linear-gradient(90deg,var(--fail) 0 30%,var(--pass) 30%)"></i>Failed, then recovered</span><span><i style="background:var(--rule)"></i>Not reached</span></div></div>
   <ol>${S_.map(([n,c,e],i)=>`<li class="${c}"><div class="k">Step ${i+1}</div><div class="t">${esc(n)}</div><div class="e">${esc(e)}</div></li>`).join("")}</ol></div>`;
}

    {onSelect:r=>{UI.vSel=r.id;UI.rSel=null;draw();vRun()},selected:UI.vSel});

function vRun(){
  const v=S.validations.find(x=>x.id===UI.vSel);if(!v){$("#vRun").innerHTML="";return}
  const res=v.results, s=v.summary||{}, src=(v.source_snapshot||{}).total||{}, tgt=(v.target_snapshot||{}).total||{};
  UI.rStat=UI.rStat||"nonpass";
  const cnt=k=>res.filter(r=>k==="all"?true:k==="nonpass"?r.status!=="PASS":r.status===k).length;
  const keys=["count","valid_count","sum_amount","partitions","max_updated_at"].filter(k=>src[k]!=null||tgt[k]!=null);
  const dl=k=>{const a=parseFloat(src[k]),b=parseFloat(tgt[k]);if(isNaN(a)||isNaN(b))return src[k]===tgt[k]?"Match":"Differs";const d=b-a;return d===0?"Match":(d>0?"+":"")+fmt(Number.isInteger(d)?d:+d.toFixed(2))};
  $("#vRun").innerHTML=`<div class="box"><div class="hd"><div><h2><span class="mono">${esc(v.object)}</span> · ${esc(human(v.run_type).toLowerCase())}</h2><div class="small muted">${esc((s.strategy||{}).strategy||"")}${(s.strategy||{}).sensitive_mode?". "+esc(s.strategy.sensitive_mode):""}</div></div>${tag(v.status)}</div>
   <div class="bd">
   ${keys.length?`<div class="recon"><div><h3>AWS source</h3><table>${keys.map(k=>`<tr><td>${esc(human(k))}</td><td class="mono">${esc(fmt(src[k]))}</td></tr>`).join("")}</table></div>
     <div><h3>Google Cloud target</h3><table>${keys.map(k=>`<tr><td>${esc(human(k))}</td><td class="mono">${esc(fmt(tgt[k]))}</td></tr>`).join("")}</table></div>
     <div><h3>Difference</h3><table>${keys.map(k=>{const d=dl(k);return `<tr><td>${esc(human(k))}</td><td class="${d==="Match"?"":"delta-bad"}">${esc(d)}</td></tr>`}).join("")}</table></div></div>`:""}
   ${(v.exceptions||[]).length?`<div class="flash err"><div><b>${v.exceptions.length} open exception${v.exceptions.length>1?"s":""}</b> assigned to ${esc([...new Set(v.exceptions.map(e=>e.owner))].join(", "))}.</div></div>`:""}
   <div class="toolbar">${seg("rStat",[["nonpass","Not passing",cnt("nonpass")],["all","All",cnt("all")],["FAIL","Failed",cnt("FAIL")],["REVIEW","Review",cnt("REVIEW")],["WAIVED","Waived",cnt("WAIVED")],["NOT_RUN","Not run",cnt("NOT_RUN")]],UI.rStat)}
    <label class="inline">Check type <select id="rDim"><option value="">All types</option>${[...new Set(res.map(r=>r.dimension))].sort().map(d=>`<option ${UI.rDim===d?"selected":""} value="${esc(d)}">${esc(human(d))}</option>`).join("")}</select></label></div>
   <div class="split wide"><div id="rTbl"></div><aside class="panel" id="rPanel"></aside></div></div></div>`;
  const ord={FAIL:0,REVIEW:1,NOT_RUN:2,WAIVED:3,PASS:4};
  const draw=()=>{const rows=res.filter(r=>(UI.rStat==="all"||(UI.rStat==="nonpass"?r.status!=="PASS":r.status===UI.rStat))&&(!UI.rDim||r.dimension===UI.rDim));
    mountTable("#rTbl","tRes",rows,[
      {k:"status",l:"Result",s:x=>ord[x.status],r:x=>st(x.status)},{k:"rule",l:"Check",r:x=>`${esc(x.rule)}<div class="small muted">${esc(human(x.dimension))}${x.partition?" · "+esc(x.partition):""}</div>`},
      {k:"source_value",l:"AWS",num:true,r:x=>`<span class="mono trunc" title="${esc(x.source_value)}">${esc(x.source_value)}</span>`},{k:"target_value",l:"Google Cloud",num:true,r:x=>`<span class="mono trunc" title="${esc(x.target_value)}">${esc(x.target_value)}</span>`},
      {k:"tolerance",l:"Tolerance",r:x=>`<span class="small">${esc(x.tolerance)}</span>`}],{sort:"status",onSelect:r=>{UI.rSel=r.id;draw();rPanel(r,v)},selected:UI.rSel})};
  onSeg("rStat",x=>{UI.rStat=x;TS.tRes&&(TS.tRes.p=0);draw()});$("#rDim").onchange=e=>{UI.rDim=e.target.value;draw()};
  draw();const sel=res.find(r=>r.id===UI.rSel);sel?rPanel(sel,v):$("#rPanel").innerHTML=panelEmpty("Select a check to compare source and target values, see the evidence, or record a waiver.");
}
function rPanel(r,v){
  const d=r.details||{}, ex=(v.exceptions||[]).find(e=>e.result_id===r.id);
  const rest=Object.entries(d).filter(([k])=>k!=="detail");
  $("#rPanel").innerHTML=panel(esc(r.rule),`${esc(human(r.dimension))}${r.partition?" · partition "+esc(r.partition):""} · ${st(r.status)}`,

    (rest.length?`<h3>Evidence</h3>${rest.every(([,x])=>typeof x!=="object"||x===null)?kv(rest.map(([k,x])=>[human(k),esc(x)])):`<pre class="json">${esc(JSON.stringify(Object.fromEntries(rest),null,2))}</pre>`}`:"")+
    (r.status==="FAIL"||r.status==="REVIEW"?`<div class="form">${LIVE?`<h3 style="margin:0 0 4px">Record a waiver</h3><p class="small muted" style="margin-bottom:8px">A waiver accepts this difference for a limited time. It is written to the audit log with your name.</p>

      <label class="fld"><span>Rationale</span><textarea id="wWhy" rows="3" placeholder="Why this difference is acceptable"></textarea></label>
      <label class="fld"><span>Expires on</span><input type="date" id="wExp" value="${new Date(Date.now()+60*864e5).toISOString().slice(0,10)}"></label>
      <button class="btn primary" id="wGo">Record waiver</button><div id="wErr" class="small" style="color:var(--fail);margin-top:6px"></div>`:roNote("Recording a waiver")}</div>`:""));
  closeBind("#rPanel",()=>{UI.rSel=null;vRun()});
  const b=$("#wGo");if(b)b.onclick=async()=>{const who=$("#wWho").value.trim(),why=$("#wWhy").value.trim(),exp=$("#wExp").value;if(!who||!why||!exp){$("#wErr").textContent="Enter the approver, a rationale and an expiry date.";return}
    b.disabled=true;try{await api(`/api/v1/validation/results/${r.id}/waive`,{approver:who,rationale:why,expiry:exp});await refresh({k:"ok",html:`Waiver recorded for ${esc(r.rule)}${r.partition?" ("+esc(r.partition)+")":""}, expiring ${esc(exp)}.`})}
    catch(e){$("#wErr").textContent=e.message;b.disabled=false}};
}

function nPanel(x){
  $("#nPanel").innerHTML=panel(esc(human(x.event)),`${st(x.status)} · approval ${esc(human(x.approval).toLowerCase())}`,
    x.status==="BLOCKED_OWNER_UNKNOWN"?`<div class="flash err"><div>No verified owner for this application, so no email was drafted. Add the owner to the ownership directory and re-run.</div></div><p class="small muted">Subject that would be used: ${esc(x.subject)}</p>`:
    `<div class="mail"><dl class="mh" style="margin:0"><div><dt>To</dt><dd style="margin:0">${esc(x.recipient)}</dd></div><div><dt>Subject</dt><dd style="margin:0"><b style="font-weight:500">${esc(x.subject)}</b></dd></div></dl><div class="mb">${esc(x.body)}</div></div>
     <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="nCopy">Copy text</button></div><p class="small muted" style="margin-top:8px">Drafts are not sent from the prototype. Copy the text into your mail client after review.</p>`);
  closeBind("#nPanel",()=>{UI.nSel=null;sBody()});
  const b=$("#nCopy");if(b)b.onclick=async()=>{try{await navigator.clipboard.writeText(`To: ${x.recipient}\nSubject: ${x.subject}\n\n${x.body}`);b.textContent="Copied"}catch(e){b.textContent="Copy failed"}};
}

/* ============================================================== 12 audit */
function vAudit(){
  const a=S.audit;UI.aTab=UI.aTab||"approvals";
  const desc={"migration_readiness_report.html":"Readiness report for review","migration_readiness_report.pdf":"Readiness report, printable","migration_report.xlsx":"All tables in one workbook","resources.csv":"Discovered resources","mappings.csv":"Service mappings","movement_plan.csv":"Data movement plan","batches.csv":"Load batches","validation_results.csv":"Validation checks","risks.csv":"Risk scores and gates","stakeholders.csv":"Owner directory","notifications.csv":"Stakeholder drafts","audit.csv":"Audit log"};
  const sim=S.approvals.filter(x=>/SIMULATED/i.test(x.approver)).length;
  return head("audit","Exports for review and a tamper-evident record of every action and decision.")+`
  <div class="cols c2">
   <div class="box"><div class="hd"><h2>Exports</h2><span class="note">${(S.reports||[]).length} files</span></div>
    <div class="tw flush"><table><thead><tr><th>File</th><th>Contents</th></tr></thead><tbody>${(S.reports||[]).map(r=>{const f=r.split("/").pop();return `<tr><td><a class="mono" href="${LIVE?"/api/v1/reports/"+esc(f):esc(r)}" target="_blank" rel="noopener">${esc(f)}</a></td><td class="small sub">${esc(desc[f]||"")}</td></tr>`}).join("")}</tbody></table></div></div>
   <div class="box"><div class="hd"><h2>Audit integrity</h2>${tag(a.chain.valid?"PASS":"FAIL",a.chain.valid?"Chain intact":"Chain broken")}</div><div class="bd">
    <p class="sub" style="margin-bottom:10px">${fmt(a.chain.events)} events. Each event stores the SHA-256 hash of the previous one, so any edit to history is detectable.</p>
    ${kv([["Latest hash",`<code>${esc(a.chain.head)}</code>`],["Approvals",`${S.approvals.length}${sim?`, of which ${sim} recorded by the demo script`:""}`],["Engine runs",`${S.agent_runs.length}, all completed with deterministic rules`]])}</div></div></div>
  <div style="margin-top:20px">${tabs("aTabs",[["approvals","Approvals",S.approvals.length],["log","Audit log",a.events.length],["runs","Engine runs",S.agent_runs.length]],UI.aTab)}<div id="aBody"></div></div>`;
}
function bAudit(){onTabs("aTabs",v=>{UI.aTab=v;aBody()});aBody()}
function aBody(){
  if(UI.aTab==="approvals"){mountTable("#aBody","tApr",S.approvals,[{k:"created_at",l:"When",r:x=>`<span class="nowrap">${esc(String(x.created_at).replace("T"," ").slice(0,16))}</span>`},{k:"object_type",l:"Object",r:x=>esc(human(x.object_type))},
    {k:"object_id",l:"ID",r:x=>`<span class="mono small">${esc(x.object_id)}</span>`},{k:"approver",l:"Approver"},{k:"decision",l:"Decision",r:x=>st(x.decision)},{k:"rationale",l:"Rationale",r:x=>`<span class="small">${esc(x.rationale)}</span>`}],{sort:"created_at",dir:-1});return}
  if(UI.aTab==="runs"){mountTable("#aBody","tAgt",S.agent_runs,[{k:"agent_name",l:"Step"},{k:"status",l:"Status",r:x=>st(x.status)},{k:"model_version",l:"Method",r:x=>`<span class="small">${esc(x.model_version)}</span>`},
    {k:"output_ref",l:"Output",r:x=>`<span class="small mono">${esc(x.output_ref)}</span>`},{k:"started_at",l:"Started",r:x=>esc(time(x.started_at))}]);return}
  $("#aBody").innerHTML=`<div class="toolbar"><input type="search" id="aQ" placeholder="Find by action, actor or ID" value="${esc(UI.aQ||"")}"></div><div id="aTbl"></div>`;
  const draw=()=>{const q=(UI.aQ||"").toLowerCase();const rows=S.audit.events.filter(e=>!q||(e.action+e.actor+e.entity_type+e.entity_id).toLowerCase().includes(q));
    mountTable("#aTbl","tAud",rows,[{k:"seq",l:"#",num:true},{k:"ts",l:"Time",r:x=>esc(time(x.ts))},{k:"actor",l:"Actor"},{k:"action",l:"Action",r:x=>esc(human(x.action))},{k:"entity_type",l:"Entity",r:x=>esc(human(x.entity_type))},
      {k:"entity_id",l:"ID",r:x=>`<span class="mono small">${esc(x.entity_id)}</span>`},{k:"hash",l:"Hash",s:false,r:x=>`<span class="mono small" title="${esc(x.hash)}">${esc(x.hash.slice(0,12))}</span>`}],
      {sort:"seq",dir:-1,onSelect:r=>show(`Event ${r.seq}: ${human(r.action)}`,kv([["Time",esc(r.ts)],["Actor",esc(r.actor)],["Entity",`${esc(r.entity_type)} <span class="mono">${esc(r.entity_id)}</span>`],["Previous hash",`<code>${esc(r.prev_hash)}</code>`],["Hash",`<code>${esc(r.hash)}</code>`]])+`<h3 style="margin:12px 0 4px">Details</h3><pre class="json">${esc(JSON.stringify(r.details,null,2))}</pre>`),key:r=>r.id})};
  $("#aQ").oninput=e=>{UI.aQ=e.target.value;TS.tAud&&(TS.tAud.p=0);draw()};draw();
}

/* ============================================================== render */
const VIEWS={overview:[vOverview,bOverview],uploads:[vUploads,bUploads],discovery:[vDiscovery,bDiscovery],dependencies:[vDeps,bDeps],mapping:[vMapping,bMapping],
  conversion:[vConversion,bConversion],plan:[vPlan,bPlan],loads:[vLoads,bLoads],validation:[vValidation,bValidation],readiness:[vReadiness,bReadiness],
  stakeholders:[vStakeholders,bStakeholders],audit:[vAudit,bAudit]};
function render(){
  const p=S.project;
  $("#pname").textContent=p.name;$("#pmeta").textContent=`${p.aws_region} to ${p.gcp_region}`;
  $("#projPop").innerHTML=`<h3 style="margin-bottom:8px">${esc(p.name)}</h3>${kv([["Customer",esc(p.customer)],["Owner",esc(p.owner)],["AWS account",esc(p.aws_account)],["AWS region",esc(p.aws_region)],["GCP project",esc(p.gcp_project)],["GCP region",esc(p.gcp_region)],["Environment",esc(p.config.environment)],["Criticality",esc(p.config.criticality)],["Bandwidth",`${fmt(p.config.bandwidth_mbps)} Mbps`],["Catalogue",`${esc(S.catalogue.version)}, ${S.catalogue.entries} services`],["Project ID",`<span class="mono">${esc(p.id)}</span>`]])}`;
  $("#mode").className="mode"+(LIVE?" live":"");$("#mode span").textContent=LIVE?"Live":"Snapshot, read-only";
  $("#btnReset").hidden=!LIVE;
  $("#btnReport").href=LIVE?"/api/v1/reports/migration_readiness_report.html":"reports/migration_readiness_report.html";
  renderNav();
  const r=route(), [v,b]=VIEWS[r];
  document.title=`${TITLES[r][1]} · Migration Accelerator`;
  $("#main").innerHTML=v();b();
  FLASH=null;
}
window.addEventListener("hashchange",()=>{render();const m=$("#main");m.classList.remove("enter");void m.offsetWidth;m.classList.add("enter");$("#main").focus({preventScroll:true});window.scrollTo(0,0)});
window.addEventListener("resize",()=>{if(route()==="dependencies")fitG()});
$("#projBtn").onclick=e=>{e.stopPropagation();const on=$("#projPop").classList.toggle("on");$("#projBtn").setAttribute("aria-expanded",on)};
document.addEventListener("click",e=>{if(!e.target.closest(".proj")){$("#projPop").classList.remove("on");$("#projBtn").setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#projPop").classList.remove("on")});
$("#btnReset").onclick=async()=>{if(!confirm("Reset the demo run? Approvals and waivers made in this session will be replaced by a fresh run."))return;
  $("#btnReset").disabled=true;$("#btnReset").textContent="Resetting";await fetch("/api/v1/demo/run",{method:"POST"});$("#btnReset").textContent="Reset demo run";$("#btnReset").disabled=false;Object.keys(UI).forEach(k=>delete UI[k]);await refresh({k:"ok",html:"Demo run reset."})};

async function load(){
  if(window.__STATE__){S=window.__STATE__;LIVE=false}
  else{try{const r=await fetch("/api/v1/state");if(!r.ok)throw new Error(r.statusText);S=await r.json();LIVE=true}
    catch(e){$("#main").innerHTML=`<div class="flash err" style="margin:24px"><div><b>No project data found.</b> Start the API with <code>uvicorn accelerator.api:app</code>, or open the exported <code>console.html</code> from a demo run.</div></div>`;return}}
  render();
}
load();
</script>
